<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title th:text="${role == 'ADMIN' ? 'Edit User' : 'User Profile'}"></title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Responsive bootstrap 4 admin template" name="description"/>
    <meta content="Coderthemes" name="author"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>

    <!------------------------------Admin Screen--------------------------------------------------------->
    <th:block th:if="${role == 'Admin'}">
        <!-- App favicon -->
        <link rel="shortcut icon" th:href="@{/admin_side/images/favicon.ico}">
        <!-- Plugin css -->
        <link th:href="@{/admin_side/libs/bootstrap-tagsinput/bootstrap-tagsinput.css}" rel="stylesheet"/>
        <link th:href="@{/admin_side/libs/switchery/switchery.min.css}" rel="stylesheet" type="text/css"/>
        <link th:href="@{/admin_side/libs/select2/select2.min.css}" rel="stylesheet" type="text/css"/>
        <link th:href="@{/admin_side/libs/clockpicker/bootstrap-clockpicker.min.css}" rel="stylesheet">
        <link th:href="@{/admin_side/libs/bootstrap-timepicker/bootstrap-timepicker.min.css}" rel="stylesheet"
              type="text/css"/>
        <link th:href="@{/admin_side/libs/bootstrap-colorpicker/bootstrap-colorpicker.min.css}" rel="stylesheet"
              type="text/css"/>
        <link th:href="@{/admin_side/libs/bootstrap-datepicker/bootstrap-datepicker.css}" rel="stylesheet">
        <link th:href="@{/admin_side/libs/bootstrap-daterangepicker/daterangepicker.css}" rel="stylesheet">
        <!-- Summernote css -->
        <link th:href="@{/admin_side/libs/summernote/summernote-bs4.css}" rel="stylesheet" type="text/css"/>
        <!-- App css -->
        <link th:href="@{/admin_side/css/bootstrap.min.css}" rel="stylesheet" type="text/css"
              id="bootstrap-stylesheet"/>
        <link th:href="@{/admin_side/css/icons.min.css}" rel="stylesheet" type="text/css"/>
        <link th:href="@{/admin_side/css/app.min.css}" rel="stylesheet" type="text/css" id="app-stylesheet"/>
        <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css}">
        <link rel="stylesheet" th:href="@{/admin_side/css/edit-account.css}" type="text/css"/>
    </th:block>

    <!-------------------------------- User Screen---------------------------------------------------->
    <th:block th:unless="${role == 'Admin'}">
        <link th:href="@{/user_side/css/bootstrap.min.css}" rel="stylesheet">
        <link th:href="@{/user_side/css/mdb.min.css}" rel="stylesheet">
        <link th:href="@{/user_side/css/plugins.css}" rel="stylesheet">
        <link th:href="@{/user_side/css/style.css}" rel="stylesheet">
        <link th:href="@{/user_side/css/coloring.css}" rel="stylesheet">
        <link id="colors" th:href="@{/user_side/css/colors/scheme-01.css}" rel="stylesheet">
        <style>
            .required-label::after {
                content: " *";
                color: red;
                font-weight: bold;
            }

            .btn-primary {
                background-color: green !important;
                border-color: green !important;
            }
        </style>
        <style>
            body {
                background-image: url('/user_side/images/background/background3.jpg');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                min-height: 100vh;
                margin: 0;
                padding: 0;
            }
        </style>
    </th:block>

</head>

<body>

<!-- Begin page -->
<div id="wrapper">

    <div id="de-preloader"></div>

    <!-- Topbar Start -->
    <!-- Topbar -->
    <th:block th:if="${role == 'Admin'}">
        <div th:replace="~{admin_side/top-sidebar :: topSidebar}"></div>
    </th:block>

    <!-- Left Sidebar -->
    <th:block th:if="${role == 'Admin'}">
        <div th:replace="~{admin_side/left-sidebar :: leftSidebar}"></div>
    </th:block>

    <!-- User Header -->
    <th:block th:if="${role != 'Admin'}">
        <div th:replace="~{user_side/header::header}"></div>
    </th:block>

    <!-- ============================================================== -->
    <!-- Start Page Content here -->
    <!-- ============================================================== -->
    <div class="container" style="margin-top: 100px;">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow p-4 rounded-5">
                    <h2 class="text-center mb-4"
                        th:text="${role == 'Admin' ? (user.id != null ? 'Edit User' : 'Add User') : 'User Profile'}">
                    </h2>

                    <!-- Success Message -->
                    <div th:if="${message}" class="alert alert-success mt-3">
                        <strong>Success!</strong> <span th:text="${message}"></span>
                    </div>

                    <!-- Error Message -->
                    <div th:if="${error}" class="alert alert-danger mt-3">
                        <strong>Error!</strong> <span th:text="${error}"></span>
                    </div>


                    <form id="userForm"
                          th:action="@{${role == 'Admin' ? '/admin/api/save-user' : '/auth/update-account'}}"
                          method="post"
                          th:object="${user}">

                        <input type="hidden" th:field="*{id}" id="userID">

                        <!-- Full Name -->
                        <div class="mb-3">
                            <label class="form-label">Full Name <span class="text-danger">*</span> </label>
                            <input type="text" class="form-control"  th:field="*{fullName}" id="fullName"
                                   th:readonly="${!(role != 'Admin' or user.id == null)}">
                            <div class="text-danger" id="errorFullName"></div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label">Email<span class="text-danger">*</span> </label>
                            <input type="email" class="form-control"  th:field="*{email}" id="email"
                                   th:readonly="${user.id != null}">
                            <div class="text-danger" id="errorEmail"></div>
                        </div>

                        <!-- DOB -->
                        <div class="mb-3">
                            <label class="form-label">D.O.B<span class="text-danger">*</span></label>
                            <input type="date" class="form-control"  th:field="*{dob}" id="dob"
                                   th:readonly="${!(role != 'Admin' or user.id == null)}">
                            <div class="text-danger" id="errorDob"></div>
                        </div>

                        <!-- Phone -->
                        <div class="mb-3">
                            <label class="form-label">Phone No.<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{phone}" id="phone"
                                   th:readonly="${!(role != 'Admin' or user.id == null)}">
                            <div class="text-danger" id="errorPhone"></div>
                        </div>

                        <!-- Address (Chỉ hiển thị nếu là USER) -->
                        <div th:if="${role != 'Admin'}">
                            <h5>Address</h5>
                            <div class="mb-3">
                                <select onchange="loadDistrict(this.value)" name="city" class="form-control">
                                    <option th:text="${user.city != null ? user.city.cityName : 'Province/City'}"
                                            disabled selected></option>
                                    <option th:each="city : ${citys}" th:value="${city.id}"
                                            th:text="${city.cityName}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <select onchange="loadWard(this.value)" name="district" id="district"
                                        class="form-control" required disabled>
                                    <option value="" disabled selected
                                            th:text="${user.district != null ? user.district.districtName : 'District'}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <select onchange="enableParam('address')" name="ward" id="ward" class="form-control"
                                        required disabled>
                                    <option value="" disabled selected
                                            th:text="${user.ward != null ? user.ward.wardName : 'Ward'}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <input type="text" name="address" id="address" class="form-control"
                                       th:value="${user.address}" placeholder="Enter your address..." maxlength="255"
                                       required disabled>
                            </div>
                        </div>

                        <!-- Role (Chỉ hiển thị nếu là ADMIN) -->
                        <div class="mb-3" th:if="${role == 'Admin'}">
                            <label class="form-label">Role<span class="text-danger">*</span></label>
                            <select name="role" class="form-control" th:field="*{role}" id="role">
                                <option th:each="role : ${roles}" th:value="${role.typeValue}"
                                        th:text="${role.typeValue}"></option>
                            </select>
                            <div class="text-danger" id="errorRole"></div>
                        </div>

                        <!-- Status (Chỉ hiển thị nếu là ADMIN) -->
                        <div class="mb-3" th:if="${role == 'Admin'}">
                            <label class="form-label">Status<span class="text-danger">*</span></label>
                            <select name="status" class="form-control" th:field="*{status}" id="status">
                                <option th:each="sta : ${status}" th:value="${sta.typeValue}"
                                        th:text="${sta.typeValue}"></option>
                            </select>
                            <div class="text-danger" id="errorStatus"></div>
                        </div>

                        <!-- Success Message -->
                        <div th:if="${successMessage}" class="alert alert-success mt-3">
                            <strong>Success!</strong> <span th:text="${successMessage}"></span>
                        </div>

                        <!-- Buttons -->
                        <div class="text-center">
                            <button
                                    th:attr="type=${role == 'Admin' ? 'button' : 'reset'}"
                                    class="btn btn-danger"
                                    id="cancel-button">
                                Cancel
                            </button>
                            <button type="submit" class="btn btn-primary" id="save-user" data-role="${role}"
                                    th:text="${role == 'Admin' ? 'Save' : 'Update'}"></button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- END wrapper -->


<!---------------------------------------- Admin -------------------------------------->
<th:block th:if="${#strings.equalsIgnoreCase(role, 'Admin')}">
    <!-- Vendor js -->
    <script src="/admin_side/js/vendor.min.js"></script>
    <script src="/admin_side/libs/moment/moment.min.js"></script>
    <script src="/admin_side/libs/bootstrap-tagsinput/bootstrap-tagsinput.min.js"></script>
    <script src="/admin_side/libs/switchery/switchery.min.js"></script>
    <script src="/admin_side/libs/select2/select2.min.js"></script>
    <script src="/admin_side/libs/parsleyjs/parsley.min.js"></script>
    <script src="/admin_side/libs/bootstrap-filestyle2/bootstrap-filestyle.min.js"></script>
    <script src="/admin_side/libs/bootstrap-timepicker/bootstrap-timepicker.min.js"></script>
    <script src="/admin_side/libs/bootstrap-colorpicker/bootstrap-colorpicker.min.js"></script>
    <script src="/admin_side/libs/clockpicker/bootstrap-clockpicker.min.js"></script>
    <script src="/admin_side/libs/bootstrap-datepicker/bootstrap-datepicker.min.js"></script>
    <script src="/admin_side/libs/bootstrap-daterangepicker/daterangepicker.js"></script>
    <!-- Summernote js -->
    <script src="/admin_side/libs/summernote/summernote-bs4.min.js"></script>

    <!-- Init js-->
    <script src="/admin_side/js/pages/form-advanced.init.js"></script>

    <!-- App js -->
    <script src="/admin_side/js/app.min.js"></script>
    <script src="/admin_side/js/edit-account.js"></script>

</th:block>
<th:block th:if="${!#strings.equalsIgnoreCase(role, 'Admin')}">
    <script th:src="@{/user_side/js/plugins.js}"></script>
    <script th:src="@{/user_side/js/designesia.js}"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js">
    </script>
    <script th:src="@{/user_side/js/address-load.js}"></script>
</th:block>

</body>
</html>
