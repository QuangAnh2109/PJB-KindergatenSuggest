<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title th:text="${user.id == null ? 'Add User' : (viewMode ? 'User Details' : 'Edit User Account')}"></title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Responsive bootstrap 4 admin template" name="description"/>
    <meta content="Coderthemes" name="author"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>

    <!------------------------------Admin Screen--------------------------------------------------------->
    <!-- App favicon -->
    <link rel="shortcut icon" th:href="@{/admin_side/images/favicon.ico}">
    <!-- Plugin css -->
    <link th:href="@{/admin_side/libs/bootstrap-tagsinput/bootstrap-tagsinput.css}" rel="stylesheet"/>
    <link th:href="@{/admin_side/libs/select2/select2.min.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/admin_side/libs/bootstrap-datepicker/bootstrap-datepicker.css}" rel="stylesheet">
    <link th:href="@{/admin_side/libs/bootstrap-daterangepicker/daterangepicker.css}" rel="stylesheet">
    <!-- Summernote css -->
    <link th:href="@{/admin_side/libs/summernote/summernote-bs4.css}" rel="stylesheet" type="text/css"/>
    <!-- App css -->
    <link th:href="@{/admin_side/css/bootstrap.min.css}" rel="stylesheet" type="text/css"
          id="bootstrap-stylesheet"/>
    <link th:href="@{/admin_side/css/icons.min.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/admin_side/css/app.min.css}" rel="stylesheet" type="text/css" id="app-stylesheet"/>
    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/admin_side/css/edit-account.css}" type="text/css"/>
</head>

<body>

<!-- Begin page -->
<div id="wrapper" style="overflow-x:hidden; position: relative">

    <!-- Topbar Start -->
    <!-- Topbar -->
    <th:block>
        <div th:replace="~{admin_side/top-sidebar :: topSidebar}"></div>
    </th:block>

    <!-- Left Sidebar -->
    <th:block>
        <div th:replace="~{admin_side/left-sidebar :: leftSidebar}"></div>
    </th:block>


    <!-- ============================================================== -->
    <!-- Start Page Content here -->
    <!-- ============================================================== -->

    <div class="content-page">

        <div class="content">

            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div>
                            <nav aria-label="breadcrumb">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a th:href="@{/admin/user-list}">User Management</a>
                                    </li>
                                    <li class="breadcrumb-item active" aria-current="page"
                                        th:text="${user.id == null ? 'Add User' : (viewMode ? 'User Details' : 'Edit User Account')}"></li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>
                <div class="row justify-content-center">
                    <div class="col-lg-6">
                        <div class="card shadow p-4 rounded-5">
                            <h2 class="text-center mb-4"
                                th:text="${user.id == null ? 'Add User' : (viewMode ? 'User Details' : 'Edit User Account')}">
                            </h2>

                            <!-- Success Message -->
                            <div th:if="${message}" class="alert alert-success mt-3">
                                <strong>Success!</strong> <span th:text="${message}"></span>
                            </div>

                            <!-- Error Message -->
                            <div th:if="${error}" class="alert alert-danger mt-3">
                                <strong>Error!</strong> <span th:text="${error}"></span>
                            </div>


                            <form id="userForm"
                                  th:action="@{/admin/api/save-user}"
                                  method="post"
                                  th:object="${user}">

                                <input type="hidden" th:field="*{id}" id="userID">
                                <input type="hidden" th:field="*{recordNo} " id="recordNo">

                                <!-- Full Name -->
                                <div class="mb-3">
                                    <label class="form-label">Full Name <span class="text-danger">*</span> </label>
                                    <input type="text" class="form-control" th:field="*{fullName}" id="fullName"
                                           th:readonly="${!(user.id == null)}"
                                           th:placeholder="${user.id == null ? 'Enter Full Name' : ''}">
                                    <div class="text-danger" id="fullNameError"></div>
                                </div>

                                <!-- Email -->
                                <div class="mb-3">
                                    <label class="form-label">Email<span class="text-danger">*</span> </label>
                                    <input type="email" class="form-control" th:field="*{email}" id="email"
                                           th:readonly="${user.id != null}"
                                           th:placeholder="${user.id == null ? 'Enter Email' : ''}">
                                    <div class="text-danger" id="emailError"></div>
                                </div>

                                <!-- DOB -->
                                <div class="mb-3">
                                    <label class="form-label">D.O.B<span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" th:field="*{dob}" id="dob"
                                           th:readonly="${!(user.id == null)}"
                                           th:placeholder="${user.id == null ? 'Select Date of Birth' : ''}">
                                    <div class="text-danger" id="dobError"></div>
                                </div>

                                <!-- Phone -->
                                <div class="mb-3">
                                    <label class="form-label">Phone No.<span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{phone}" id="phone"
                                           th:readonly="${!(user.id == null)}"
                                           th:placeholder="${user.id == null ? 'Enter Phone Number' : ''}">
                                    <div class="text-danger" id="phoneError"></div>
                                </div>

                                <!-- Role -->
                                <div class="mb-3">
                                    <label class="form-label">Role<span class="text-danger">*</span></label>
                                    <div th:if="${!viewMode}">
                                        <select name="role" class="form-control" th:field="*{role}" id="role">
                                            <option th:each="role : ${roles}" th:value="${role.typeValue}"
                                                    th:text="${role.typeValue}"></option>
                                        </select>
                                    </div>
                                    <div th:if="${viewMode}">
                                        <input name="role" class="form-control" th:field="*{role}"/>
                                    </div>
                                    <div class="text-danger" id="roleError"></div>
                                </div>

                                <!-- Status -->
                                <div class="mb-3">
                                    <label class="form-label">Status<span class="text-danger">*</span></label>
                                    <div th:if="${!viewMode}">
                                        <select name="status" class="form-control" th:field="*{status}" id="status">
                                            <option th:each="sta : ${status}"
                                                    th:value="${sta.typeValue}"
                                                    th:text="${sta.typeValue}"
                                                    th:disabled="${user.id == null && sta.typeValue == 'Inactive'}"
                                                    th:title="${user.id == null && sta.typeValue == 'Inactive' ? 'Only Active is allowed when adding new user' : ''}">
                                            </option>
                                        </select>
                                    </div>
                                    <div th:if="${viewMode}">
                                        <input name="status" class="form-control" th:field="*{status}"/>
                                    </div>
                                    <div class="text-danger" id="statusError"></div>
                                </div>



                                <!-- Buttons -->
                                <div class="text-center" th:if="${!viewMode}">
                                    <button type="button" class="btn btn-danger" id="cancel-button">Cancel</button>
                                    <button type="submit" class="btn btn-primary" id="save-user"
                                            th:text="${user.id == null ? 'Create' : 'Save'}"></button>
                                </div>
                                <div class="text-center" th:if="${viewMode}">
                                    <a th:href="@{/admin/user-list}" class="btn btn-primary">Back</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <footer class="footer">
                    <div class="container-fluid">
                        <div class="row">
                            <div class="col-md-12">2017 - 2020 &copy; Simple theme by <a href="#">Coderthemes</a></div>
                        </div>
                    </div>
                </footer>




            </div>
            <!-- end container-fluid -->

        </div>
        <!-- end content -->

    </div>
    <!-- END content-page -->

</div>

<!-- END wrapper -->

<!-- Modal -->
<div class="modal fade" id="notificationModal" tabindex="-1" aria-labelledby="notificationModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="notificationModalLabel">Notification</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="modalMessage">
                <!-- Message will be inserted here -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>




]    <!-- Vendor js -->
<script src="/admin_side/js/vendor.min.js"></script>
<script src="/admin_side/libs/moment/moment.min.js"></script>
<script src="/admin_side/libs/bootstrap-tagsinput/bootstrap-tagsinput.min.js"></script>
<script src="/admin_side/libs/select2/select2.min.js"></script>
<script src="/admin_side/libs/parsleyjs/parsley.min.js"></script>
<script src="/admin_side/libs/bootstrap-filestyle2/bootstrap-filestyle.min.js"></script>
<script src="/admin_side/libs/bootstrap-datepicker/bootstrap-datepicker.min.js"></script>
<script src="/admin_side/libs/bootstrap-daterangepicker/daterangepicker.js"></script>
<!-- Summernote js -->
<script src="/admin_side/libs/summernote/summernote-bs4.min.js"></script>

<!-- Init js-->
<script src="/admin_side/js/pages/form-advanced.init.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- App js -->
<script src="/admin_side/js/app.min.js"></script>
<script src="/admin_side/js/edit-account.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var currentPath = window.location.pathname;

        if (currentPath.includes("/admin/user-list") ||
            currentPath.includes("/admin/edit-user") ||
            currentPath.includes("/admin/add-user")||
            currentPath.includes("/admin/user-details")) {

            let userManagementLink = document.querySelector("#side-menu a[href='/admin/user-list']");
            if (userManagementLink) {
                userManagementLink.classList.add("active");
                let parentLi = userManagementLink.closest("li");
                if (parentLi) {
                    parentLi.classList.add("mm-active");
                    let parentUl = parentLi.closest("ul");
                    if (parentUl) {
                        parentUl.classList.add("mm-show");
                        let parentLi2 = parentUl.closest("li");
                        if (parentLi2) {
                            parentLi2.classList.add("mm-active");
                        }
                    }
                }
            }
        }
    });
</script>

</body>
</html>
