<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">


<!-- Mirrored from coderthemes.com/simple/layouts/vertical/forms-general.html by HTTrack Website Copier/3.x [XR&CO'2014], Wed, 28 Aug 2024 07:26:06 GMT -->
<head>
    <meta charset="utf-8"/>
    <title>Dashboard | Simple - Responsive Bootstrap 4 Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Responsive bootstrap 4 admin template" name="description"/>
    <meta content="Coderthemes" name="author"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <!-- App favicon -->
    <link rel="shortcut icon" th:href="@{/admin_side/images/favicon.ico}">
    <!-- App css -->
    <link th:href="@{/admin_side/css/bootstrap.min.css}" rel="stylesheet" type="text/css" id="bootstrap-stylesheet"/>
    <link th:href="@{/admin_side/css/icons.min.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/admin_side/css/app.min.css}" rel="stylesheet" type="text/css" id="app-stylesheet"/>
    <link th:href="@{/admin_side/css/request-list-detail.css}" rel="stylesheet" type="text/css"/>
    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css}">

    <!-- Bootstrap Modal-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery và Bootstrap modal -->
    <script th:src="@{https://code.jquery.com/jquery-3.6.0.min.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .btn-closed {
            background-color: #E6FAE6; /* Nền xanh nhạt */
            color: #28a745; /* Chữ xanh lá */
            border: 1px solid #555; /* Viền đen nhạt */
            border-radius: 20px; /* Bo tròn viền */
            padding: 3px 15px; /* Kích thước nút */
            font-weight: bold; /* Chữ đậm */
            font-size: 14px; /* Kích thước chữ */
            min-width: 80px; /* Độ rộng tối thiểu */
            text-align: center; /* Canh giữa chữ */
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: none; /* Xóa hiệu ứng bóng */
            outline: none; /* Xóa viền focus */
        }

        .btn-closed:hover {
            background-color: #D4F5D4; /* Hover nhẹ */
            border-color: #333;
            cursor: pointer;
        }
    </style>
</head>

<body>

<!-- Begin page -->
<div id="wrapper">
    <!-- Topbar Start -->
    <div th:replace="~{admin_side/top-sidebar :: topSidebar}"></div>
    <!-- end Topbar -->

    <!-- Left Sidebar Start -->
    <div th:replace="~{admin_side/left-sidebar :: leftSidebar}"></div>
    <!-- Left Sidebar End -->


    <div class="content-page">
        <div class="content">

            <!-- Start container-fluid -->
            <div class="container-fluid">
                <div>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item">
                                <a th:href="${page == 'Detail' ? '/manager/request-reminder' : '/manager/request-list'}"
                                   th:text="${page == 'Detail' ? 'Reminder' : 'Request Management'}">
                                    Request Management
                                </a>
                            </li>
                            <li class="breadcrumb-item">
                                <a th:href="${page == 'Detail' ? '/manager/request-reminder' : '/manager/request-list'}"
                                   th:text="${page == 'Detail' ? 'Request Reminder' : 'Request List'}">
                                    Request List
                                </a>
                            </li>
                            <li class="breadcrumb-item active" aria-current="page">Request Details</li>
                        </ol>
                    </nav>
                </div>

                <!-- start  -->
                <div style="display: flex; align-items: center;">
                    <h3 style="color: buttontext; margin-right: 20px;">Request details</h3>
                    <button class="btn btn-closed">
                        <span th:text="${requestDetail.requestMasterName}">Closed</span>
                    </button>
                </div>

                <!-- end row -->

                <div class="row justify-content-center">
                    <div class="col-lg-8"> <!-- Tăng kích thước cột để input dài hơn -->
                        <form class="form-horizontal" style="margin-top: 50px" th:object="${requestDetail}"
                              method="POST">
                            <div class="mb-3 row">
                                <label class="col-md-4 col-form-label fw-bold text-end">Full Name</label>
                                <div class="col-md-7">
                                    <input type="text" th:field="*{fullName}" class="form-control" readonly>
                                </div>
                            </div>

                            <div class="mb-3 row">
                                <label class="col-md-4 col-form-label fw-bold text-end">Email</label>
                                <div class="col-md-7">

                                    <input type="email" class="form-control" th:field="*{requestEmail}" readonly>
                                </div>
                            </div>

                            <div class="mb-3 row">
                                <label class="col-md-4 col-form-label fw-bold text-end">Phone No.</label>
                                <div class="col-md-7">
                                    <input type="text" class="form-control" th:field="*{requestPhone}" readonly>
                                </div>
                            </div>

                            <div class="mb-3 row">
                                <label class="col-md-4 col-form-label fw-bold text-end">Address</label>
                                <div class="col-md-7">
                                    <input type="text" class="form-control" th:field="*{address}" readonly>
                                </div>
                            </div>

                            <div class="mb-3 row">
                                <label class="col-md-4 col-form-label fw-bold text-end">Requested school</label>
                                <div class="col-md-7">
                                    <input type="text" class="form-control" th:field="*{requestSchoolName}" readonly>
                                </div>
                            </div>

                            <div class="mb-3 row">
                                <label class="col-md-4 col-form-label fw-bold text-end">Inquires</label>
                                <div class="col-md-7">
                                    <textarea class="form-control" th:field="*{inquires}" readonly rows="4"></textarea>

                                </div>
                            </div>

                            <div class="d-flex justify-content-end"
                                 th:if="${requestDetail.requestMasterName!='Closed'}">
                                <button type="button" class="btn btn-primary" data-toggle="modal"
                                        data-target="#exampleModal">
                                    Mark it resolved
                                </button>
                            </div>
                            <div class="modal fade" id="exampleModal" tabindex="-1" role="dialog"
                                 aria-labelledby="exampleModalLabel" aria-hidden="true">
                                <div class="modal-dialog" role="document">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h5 class="modal-title" id="exampleModalLabel">Mark request resolved</h5>
                                            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                                <span aria-hidden="true">&times;</span>
                                            </button>
                                        </div>
                                        <div class="modal-body">
                                            Are you sure you want to mark this request resolved
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-light text-primary fw-bold"
                                                    data-dismiss="modal">No. Take me back!
                                            </button>
                                            <button type="button" class="btn btn-primary px-4"
                                                    th:onclick="|window.location.href='@{/manager/updateRequest(id=${requestDetail.id}, page=${page},currentPage=${currentPage})}'|">
                                                Yes
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- end container-fluid -->

                <!-- Footer Start -->
                <footer class="footer">
                    <div class="container-fluid">
                        <div class="row">
                            <div class="col-md-12">
                                2017 - 2020 &copy; Simple theme by <a href="#">Coderthemes</a>
                            </div>
                        </div>
                    </div>
                </footer>
                <!-- end Footer -->

            </div>
            <!-- end content -->

        </div>
        <!-- END content-page -->

    </div>
    <!-- END wrapper -->


    <!-- Right Sidebar -->
    <div class="right-bar">
        <div class="rightbar-title">
            <a href="javascript:void(0);" class="right-bar-toggle float-right">
                <i class="mdi mdi-close"></i>
            </a>
            <h5 class="font-16 m-0 text-white">Theme Customizer</h5>
        </div>
        <div class="slimscroll-menu">

            <div class="p-4">
                <div class="alert alert-warning" role="alert">
                    <strong>Customize </strong> the overall color scheme, layout, etc.
                </div>
                <div class="mb-2">
                    <img src="assets/images/layouts/light.png" class="img-fluid img-thumbnail" alt="">
                </div>
                <div class="custom-control custom-switch mb-3">
                    <input type="checkbox" class="custom-control-input theme-choice" id="light-mode-switch" checked/>
                    <label class="custom-control-label" for="light-mode-switch">Light Mode</label>
                </div>

                <div class="mb-2">
                    <img src="assets/images/layouts/dark.png" class="img-fluid img-thumbnail" alt="">
                </div>
                <div class="custom-control custom-switch mb-3">
                    <input type="checkbox" class="custom-control-input theme-choice" id="dark-mode-switch"
                           data-bsStyle="assets/css/bootstrap-dark.min.css"
                           data-appStyle="assets/css/app-dark.min.css"/>
                    <label class="custom-control-label" for="dark-mode-switch">Dark Mode</label>
                </div>

                <div class="mb-2">
                    <img src="assets/images/layouts/rtl.png" class="img-fluid img-thumbnail" alt="">
                </div>
                <div class="custom-control custom-switch mb-5">
                    <input type="checkbox" class="custom-control-input theme-choice" id="rtl-mode-switch"
                           data-appStyle="assets/css/app-rtl.min.css"/>
                    <label class="custom-control-label" for="rtl-mode-switch">RTL Mode</label>
                </div>

                <a href="https://1.envato.market/EK71X" class="btn btn-danger btn-block mt-3" target="_blank"><i
                        class="mdi mdi-download mr-1"></i> Download Now</a>
            </div>
        </div> <!-- end slimscroll-menu-->
    </div>
    <!-- /Right-bar -->

    <!-- Right bar overlay-->
    <div class="rightbar-overlay"></div>


    <!-- Vendor js -->
    <script src="assets/js/vendor.min.js"></script>

    <!-- App js -->
    <script src="assets/js/app.min.js"></script>
</div>
</body>

</html>
