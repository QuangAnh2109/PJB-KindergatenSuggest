<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Tables Advanced | Simple - Responsive Bootstrap 4 Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Responsive bootstrap 4 admin template" name="description"/>
    <meta content="Coderthemes" name="author"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <!-- App favicon -->
    <link rel="shortcut icon" th:href="@{/admin_side/images/favicon.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App css -->
    <link th:href="@{/admin_side/css/bootstrap.min.css}" rel="stylesheet" type="text/css" id="bootstrap-stylesheet"/>
    <link th:href="@{/admin_side/css/icons.min.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/admin_side/css/app.min.css}" rel="stylesheet" type="text/css" id="app-stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script th:src="@{/admin_side/js/parent-list.js}"></script>
    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css}">
    <!--    <link th:href="@{/admin_side/css/request-list.css}" rel="stylesheet" type="text/css"/>-->

</head>

<body>

<!-- Begin page -->
<div id="wrapper" style="overflow-x:hidden;position: relative">


    <!-- Topbar Start -->
    <!-- Topbar Start -->
    <div th:replace="~{admin_side/top-sidebar :: topSidebar}"></div>
    <!-- end Topbar -->

    <!-- Left Sidebar Start -->
    <div th:replace="~{admin_side/left-sidebar :: leftSidebar}"></div>
    <!-- End Sidebar -->
    <!-- End Sidebar -->

    <!-- ============================================================== -->
    <!-- Start Page Content here -->
    <!-- ============================================================== -->

    <div class="content-page">
        <div class="content" id="main-content" th:fragment="main-content">

            <!-- Start container-fluid -->
            <div class="container-fluid">

                <!-- start  -->
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/manager/parent-list}">Parent Management</a></li>
                        <li class="breadcrumb-item">Parent List</li>
                    </ol>
                </nav>
                <!-- end row -->

                <div class="row">
                    <div class="col-12">
                        <div>
                            <div th:if="${message != null}"
                                 class="alert alert-danger text-danger alert-dismissible fade show" role="alert">
                                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                                <strong th:text="${action}">!</strong> <span th:text="${message}"></span>
                            </div>
                            <!--                            <form action="/admin/parent-list" method="get">-->
                            <div class="row">
                                <div class="col-lg-8 mb-2" >
                                    <button class="btn" id="downloadButton" style="background-color: green"><i
                                            class="fa fa-download"></i> Download
                                    </button>
                                </div>

                                <div class="col-lg-4 mb-2">
                                    <div class="d-flex justify-content-end align-items-center mb-3"
                                         style="max-width: 100%">

                                        <input type="search" id="parentSearchField" name="search" class="form-control" style="border-radius: 20px 0 0 20px"
                                               th:placeholder="Search" aria-label="Search" th:value="${search}"
                                               autocomplete="off" inputmode="none" maxlength="400">
                                        <button id="searchButtonParent" type="button"
                                                class="btn" style="border-radius: 0 20px 20px 0; background-color: #458bc4">
                                            <i class="fa fa-search"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <!--                            </form>-->
                            <div style="max-height: 800px; overflow-y: auto;">
                                <table id="" class="table table-striped table-bordered dt-responsive nowrap"
                                       style="border-collapse: collapse; border-spacing: 0; width: 100%;">
                                    <thead class="head">
                                    <tr>
                                        <th>Full Name</th>
                                        <th>Email</th>
                                        <th>Phone No.</th>
                                        <th>Status</th>
                                        <!--                                        <th>Action</th>-->
                                    </tr>
                                    </thead>

                                    <tbody>
                                    <tr th:each="parent : ${accounts}" class="clickable-row"
                                        th:attr="data-href=@{'/manager/parent-list/parent-details/' + ${parent.parentId}}"
                                        onclick="window.location=this.getAttribute('data-href')">
                                        <th th:title="${parent.parentName}" th:text="${parent.parentName}"></th>
                                        <th th:title="${parent.parentEmail}" th:text="${parent.parentEmail}"></th>
                                        <th th:title="${parent.parentPhone}" th:text="${parent.parentPhone}"></th>
                                        <th th:title="${parent.enrollStatus}">
                                            <span th:if="${parent.enrollStatus == 'Enrolled'}"
                                                  class="rounded-pill stylebadge badge bg-success">Enrolled</span>
                                            <span th:if="${parent.enrollStatus == 'Wait approve'}"
                                                  class="rounded-pill stylebadge badge bg-warning">Waiting Request Approve</span>
                                            <span th:if="${parent.enrollStatus == 'Not Enroll'}"
                                                  class="rounded-pill stylebadge badge bg-secondary">Not Enrolled</span>
                                        </th>
                                        <!--                                        <td>-->
                                        <!--                                            <form th:action="@{'/manager/parent-list/parent-details/'+${parent.parentId}} "-->
                                        <!--                                                  method="get">-->
                                        <!--                                                <button type="submit" class="btn btn-closed">View Details</button>-->
                                        <!--                                            </form>-->
                                        <!--                                        </td>-->
                                    </tr>
                                    </tbody>
                                </table>
                                <div id="noResultsMessage" th:if="${accounts.size() == 0 || accounts==null}"
                                     class="alert alert-warning"
                                     role="alert">
                                    <span th:text="#{ME_012}">No results found.</span>
                                </div>
                            </div>

                            <nav aria-label="Page navigation">
                                <th:block th:if="${numberPage > 1}">
                                    <ul class="pagination justify-content-end">
                                        <!-- Previous Button -->
                                        <li class="page-item parent-page-item disabled" th:if="${currentPage==0}"><a
                                                class="page-link" type="button">Previous</a></li>
                                        <li th:unless="${currentPage==0}" class="page-item parent-page-item"
                                            th:data-page="${currentPage - 1}"
                                            th:classappend="${currentPage == 0} ? 'disabled'">
                                            <a class="page-link" type="button"
                                               th:aria-disabled="${currentPage == 0}">Previous</a>
                                        </li>
                                        <li class="page-item parent-page-item" th:data-page="0"
                                            th:if="${currentPage >= 3}">
                                            <a class="page-link" th:if="${currentPage >= 3}" type="button">1</a>
                                        </li>
                                        <li class="page-item" th:if="${currentPage > 3}">...</li>

                                        <!-- Page Numbers -->
                                        <!--                                        <li class="page-item parent-page-item"-->
                                        <!--                                            th:each="pageNum : ${numberPage > 0 ? #numbers.sequence(0, numberPage - 1) : #numbers.sequence(0, 0)}"-->
                                        <!--                                            th:classappend="${pageNum == currentPage} ? 'active'"-->
                                        <!--                                            th:data-page="${pageNum}">-->
                                        <!--                                            <a class="page-link" type="button" th:text="${pageNum + 1}"></a>-->
                                        <!--                                        </li>-->
                                        <li class="page-item parent-page-item"
                                            th:each="pageNum : ${#numbers.sequence(currentPage - 2, currentPage + 2)}"
                                            th:if="${pageNum >= 0 and pageNum < numberPage}"
                                            th:classappend="${pageNum == currentPage} ? 'active'"
                                            th:data-page="${pageNum}">
                                            <a class="page-link" type="button" th:text="${pageNum + 1}"></a>
                                        </li>

                                        <li class="page-item" th:if="${currentPage < numberPage - 3}">...</li>
                                        <li class="page-item parent-page-item" th:if="${currentPage < numberPage - 1 }"
                                            th:data-page="${numberPage - 1}">
                                            <a class="page-link" type="button" th:if="${currentPage < numberPage - 3}"
                                               th:text="${numberPage}"></a>
                                        </li>

                                        <!-- Next Button -->
                                        <li class="page-item parent-page-item disabled"
                                            th:if="${currentPage == numberPage - 1 || numberPage==0}"><a
                                                class="page-link" type="button">Next</a>
                                        </li>
                                        <li th:unless="${currentPage == numberPage - 1 || numberPage==0}"
                                            class="page-item parent-page-item"
                                            th:data-page="${currentPage + 1}"
                                            th:classappend="${currentPage == numberPage - 1} ? 'disabled'">
                                            <a class="page-link" type="button"
                                               th:aria-disabled="${currentPage == numberPage - 1}">Next</a>
                                        </li>
                                    </ul>
                                </th:block>
                            </nav>
                        </div>
                    </div>
                </div>
                <!-- end row -->
            </div>
            <!-- end container-fluid -->


            <!-- Footer Start -->

            <footer class="footer">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-md-12">
                            2017 - 2020 &copy; Simple theme by <a href="#">Coderthemes</a>
                        </div>
                    </div>
                </div>
            </footer>
            <!-- end Footer -->
        </div>
        <!-- end content -->
    </div>
    <!-- END content-page -->

</div>
<!-- END wrapper -->

<!-- Vendor js -->
<script th:src="@{/admin_side/js/vendor.min.js}"></script>
<script th:src="@{/admin_side/js/app.min.js}"></script>


<div class="modal fade" id="notificationModal" tabindex="-1" aria-labelledby="notificationModalLabel"
     aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="notificationModalLabel">Notification</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">X</button>
            </div>
            <div class="modal-body" id="modalMessage">
                <span th:text="#{ME_051}"></span>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
</body>
<script>
    window.addEventListener("resize", function () {

    });
</script>
<style>
    .stylebadge {
        font-size: clamp(7px, 2vw, 12px);;
        display: inline-block;
        min-width: 65px;
        max-width: 120px;
        text-align: center;
        padding: 3px 6px;
        white-space: normal;
        width: 100%;
    }

    .table th, .table td {
        /*word-wrap: break-word;*/
        white-space: nowrap;
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    th {
        font-size: clamp(10px, 2vw, 15px);
    }

    .clickable-row {
        cursor: pointer;
        transition: background-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
    }

    .clickable-row:hover {
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.4); /* Đổ bóng rõ hơn */
        font-weight: 600;
    }
</style>
<style>
    .btn-closed {
        background-color: #E6FAE6;
        color: #28a745;
        border: 2px solid #555;
        border-radius: 20px;
        padding: 5px 15px;
        font-weight: bold;
        transition: all 0.3s ease-in-out;
    }

    .app-search .form-control {
        border-radius: 20px;
        border: 2px solid #ccc;
        padding: 10px 15px;
    }

    .app-search .btn {
        background-color: #28a745;
        color: white;
        border-radius: 20px;
        padding: 8px 15px;
        border: none;
    }

    .pagination-container {
        margin-top: 20px;
    }

    .logout-container {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding-right: 20px;
    }

    .logout-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        font-size: 18px;
        font-weight: bold;
        color: #3498db;
        margin-top: 20px;
    }

    .logout-btn i {
        font-size: 22px;
        color: #333;
    }

    .btn-closed {
        font-size: 12px; /* Giảm kích thước chữ */
        padding: 3px 10px; /* Giảm padding */
        border-radius: 15px; /* Giảm độ bo tròn */
        min-width: 70px; /* Đặt chiều rộng tối thiểu */
        text-align: center;
    }
</style>
<script>

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</html>
