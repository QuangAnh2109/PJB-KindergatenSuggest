<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Tables Advanced | Simple - Responsive Bootstrap 4 Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Responsive bootstrap 4 admin template" name="description"/>
    <meta content="Coderthemes" name="author"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <!-- App favicon -->
    <link rel="shortcut icon" th:href="@{/admin_side/images/favicon.ico}">

    <!-- App css -->
    <link th:href="@{/admin_side/css/bootstrap.min.css}" rel="stylesheet" type="text/css" id="bootstrap-stylesheet"/>
    <link th:href="@{/admin_side/css/icons.min.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/admin_side/css/app.min.css}" rel="stylesheet" type="text/css" id="app-stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script th:src="@{/admin_side/js/parent-list.js}"></script>
    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css}">

    <style>
        .btn-closed {
            background-color: #E6FAE6;
            color: #0b5ed7;
            border: 2px solid #555;
            border-radius: 20px;
            padding: 5px 15px;
            font-weight: bold;
            transition: all 0.3s ease-in-out;
        }

        .btn-closed:hover {
            border-color: #333;
            background-color: #D4F5D4;
        }

        .app-search {
            display: flex;
            justify-content: flex-end;
        }

        .app-search-box {
            max-width: 300px;
        }

        .app-search .form-control {
            border-radius: 20px;
            border: 2px solid #ccc;
            padding: 10px 15px;
        }

        .app-search .btn {
            background-color: #28a745;
            color: white;
            border-radius: 20px;
            padding: 8px 15px;
            border: none;
        }

        .pagination-container {
            margin-top: 20px;
        }

        .logout-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 20px;
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            color: #3498db;
            margin-top: 20px;
        }

        .logout-btn i {
            font-size: 22px;
            color: #333;
        }

        .btn-closed {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 15px;
            min-width: 70px;
            text-align: center;
        }
    </style>
</head>

<body>

<!-- Begin page -->
<div id="wrapper">


    <!-- Topbar Start -->
    <!-- Topbar Start -->
    <div th:replace="~{admin_side/top-sidebar :: topSidebar}"></div>
    <!-- end Topbar -->

    <!-- Left Sidebar Start -->
    <div th:replace="~{admin_side/left-sidebar :: leftSidebar}"></div>
    <!-- End Sidebar -->
    <!-- End Sidebar -->

    <!-- ============================================================== -->
    <!-- Start Page Content here -->
    <!-- ============================================================== -->

    <div class="content-page">
        <div class="content" id="main-content" th:fragment="main-content">

            <!-- Start container-fluid -->
            <div class="container-fluid" id="main-contentBROS">

                <!-- start  -->
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/manager/parent-list}">Parent Management</a></li>
                        <li class="breadcrumb-item">Parent List</li>
                    </ol>
                </nav>
                <!-- end row -->

                <div class="row">
                    <div class="col-12">
                        <div>
                            <div th:if="${message != null}"
                                 class="alert alert-danger text-danger alert-dismissible fade show" role="alert">
                                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                                <strong th:text="${action}">!</strong> <span th:text="${message}"></span>
                            </div>
                            <!--                            <form action="/admin/parent-list" method="get">-->
                            <div class="row">
                                <div class="col-8">
                                </div>
                                <div class="col-4">
                                    <div class="d-flex justify-content-end align-items-center mb-3">

                                        <input type="search" id="parentSearchField" name="search" class="form-control"
                                               th:placeholder="Search" aria-label="Search" th:value="${search}">
                                        <button id="searchButtonParent" type="button"
                                                class="btn btn-success"><i
                                                class="fa fa-search"></i></button>
                                    </div>
                                </div>
                            </div>
                            <!--                            </form>-->
                            <div style="max-height: 600px; overflow-y: auto;">
                                <table class="table table-striped table-bordered dt-responsive nowrap"
                                       style="border-collapse: collapse; border-spacing: 0; width: 100%;">
                                    <colgroup>
                                        <col style="width: 20%;">
                                        <col style="width: 40%;">
                                        <col style="width: 10%;">
                                        <col style="width: 10%;">
                                    </colgroup>
                                    <thead class="head">
                                    <tr>
                                        <th>Full Name</th>
                                        <th>Email</th>
                                        <th>Phone No.</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                    </thead>

                                    <tbody>
                                    <tr th:each="parent : ${accounts}">
                                        <th th:text="${parent.parentName}"></th>
                                        <th th:text="${parent.parentEmail}"></th>
                                        <th th:text="${parent.parentPhone}"></th>
                                        <th>
                                            <span th:if="${parent.enrollStatus == 'Enrolled'}"
                                                  class="stylebadge badge bg-success">Enrolled</span>
                                            <span th:if="${parent.enrollStatus == 'Wait approve'}"
                                                  class="stylebadge badge bg-warning">Waiting Request Approve</span>
                                            <span th:if="${parent.enrollStatus == 'Not Enroll'}"
                                                  class="stylebadge badge bg-secondary">Not Enrolled</span>
                                        </th>
                                        <td>
                                            <form th:action="@{'/manager/parent-list/parent-details/'+${parent.parentId}} "
                                                  method="get">
                                                <button type="submit" class="btn btn-closed">View Details</button>
                                            </form>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                                <div id="noResultsMessage" th:if="${accounts.size() == 0 || accounts==null}"
                                     class="alert alert-warning"
                                     role="alert">
                                    <span th:text="#{ME_012}">No results found.</span>
                                </div>
                            </div>

                            <nav aria-label="Page navigation">
                                <th:block th:if="${numberPage > 1}">
                                    <ul class="pagination justify-content-end">
                                        <!-- Previous Button -->
                                        <li class="page-item parent-page-item disabled" th:if="${currentPage==0}"><a
                                                class="page-link" type="button">Previous</a></li>
                                        <li th:unless="${currentPage==0}" class="page-item parent-page-item"
                                            th:data-page="${currentPage - 1}"
                                            th:classappend="${currentPage == 0} ? 'disabled'">
                                            <a class="page-link" type="button"
                                               th:aria-disabled="${currentPage == 0}">Previous</a>
                                        </li>

                                        <!-- Page Numbers -->
                                        <li class="page-item parent-page-item"
                                            th:each="pageNum : ${numberPage > 0 ? #numbers.sequence(0, numberPage - 1) : #numbers.sequence(0, 0)}"
                                            th:classappend="${pageNum == currentPage} ? 'active'"
                                            th:data-page="${pageNum}">
                                            <a class="page-link" type="button" th:text="${pageNum + 1}"></a>
                                        </li>

                                        <!-- Next Button -->
                                        <li class="page-item parent-page-item disabled"
                                            th:if="${currentPage == numberPage - 1 || numberPage==0}"><a
                                                class="page-link" type="button">Next</a>
                                        </li>
                                        <li th:unless="${currentPage == numberPage - 1 || numberPage==0}"
                                            class="page-item parent-page-item"
                                            th:data-page="${currentPage + 1}"
                                            th:classappend="${currentPage == numberPage - 1} ? 'disabled'">
                                            <a class="page-link" type="button"
                                               th:aria-disabled="${currentPage == numberPage - 1}">Next</a>
                                        </li>
                                    </ul>
                                </th:block>
                            </nav>
                        </div>
                    </div>
                </div>
                <!-- end row -->

            </div>
            <!-- end container-fluid -->


            <!-- Footer Start -->
            <footer class="footer">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-md-12">
                            2017 - 2020 &copy; Simple theme by <a href="#">Coderthemes</a>
                        </div>
                    </div>
                </div>
            </footer>
            <!-- end Footer -->

        </div>
        <!-- end content -->

    </div>
    <!-- END content-page -->

</div>
<!-- END wrapper -->


<!-- Vendor js -->
<script th:src="@{/admin_side/js/vendor.min.js}"></script>
<script th:src="@{/admin_side/js/app.min.js}"></script>


</body>
<style>
    .stylebadge {
        font-size: 0.8rem; /* Adjust as needed */
        display: inline-block;
        width: 200px; /* Adjust as needed */
        text-align: center;
    }
</style>
</html>
