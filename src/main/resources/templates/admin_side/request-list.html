<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <title>Dashboard | Simple - Responsive Bootstrap 4 Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Responsive bootstrap 4 admin template" name="description" />
    <meta content="Coderthemes" name="author" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- App favicon -->
    <link rel="shortcut icon" th:href="@{/admin_side/images/favicon.ico}">

    <!-- App css -->
    <link th:href="@{/admin_side/css/bootstrap.min.css}" rel="stylesheet" type="text/css" />
    <link th:href="@{/admin_side/css/icons.min.css}" rel="stylesheet" type="text/css" />
    <link th:href="@{/admin_side/css/app.min.css}" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css}">

    <style>
        .btn-closed {
            background-color: #E6FAE6;
            color: #28a745;
            border: 2px solid #555;
            border-radius: 20px;
            padding: 5px 15px;
            font-weight: bold;
            transition: all 0.3s ease-in-out;
        }

        .btn-closed:hover {
            border-color: #333;
            background-color: #D4F5D4;
        }

        .app-search {
            display: flex;
            justify-content: flex-end;
        }

        .app-search-box {
            max-width: 300px;
        }

        .app-search .form-control {
            border-radius: 20px;
            border: 2px solid #ccc;
            padding: 10px 15px;
        }

        .app-search .btn {
            background-color: #28a745;
            color: white;
            border-radius: 20px;
            padding: 8px 15px;
            border: none;
        }

        .pagination-container {
            margin-top: 20px;
        }

        .logout-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 20px;
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            color: #3498db;
            margin-top: 20px;
        }

        .logout-btn i {
            font-size: 22px;
            color: #333;
        }
        .btn-closed {
            font-size: 12px; /* Giảm kích thước chữ */
            padding: 3px 10px; /* Giảm padding */
            border-radius: 15px; /* Giảm độ bo tròn */
            min-width: 70px; /* Đặt chiều rộng tối thiểu */
            text-align: center;
        }
    </style>
</head>

<body>

<div id="wrapper">

    <!-- Topbar Start -->
    <div class="navbar-custom">
        <div class="logo-box">
            <a href="index.html" class="logo text-center logo-dark">
                <span class="logo-lg">
                    <img th:src="@{/admin_side/images/logo-dark.png}" alt="" height="26">
                </span>
            </a>
        </div>
        <div class="logout-container">
            <a href="#" class="logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </a>
        </div>
    </div>
    <!-- end Topbar -->

    <!-- Left Sidebar Start -->
    <div class="left-side-menu">
        <div id="sidebar-menu">
            <ul class="metismenu" id="side-menu">
                <li><a href="index.html"><i class="ti-home"></i> <span> School Management </span></a></li>
                <li><a href="index.html"><i class="fa-regular fa-user"></i> <span> User Management </span></a></li>
                <li><a href="index.html"><i class="fa-regular fa-bell"></i> <span> Reminder </span></a></li>
                <li><a href="index.html"><i class="fa-solid fa-user-tie"></i> <span> Parent Management </span></a></li>
                <li><a href="index.html"><i class="fa-regular fa-clipboard"></i> <span> Request Management </span></a></li>
            </ul>
        </div>
    </div>
    <!-- End Sidebar -->

    5<div class="content-page">
        <div class="content">
            <div class="container-fluid">

                <!-- Search Box -->
                <div class="row">
                    <div class="col-12">
                        <form class="app-search">
                            <div class="app-search-box">
                                <div class="input-group">
                                    <input type="text" class="form-control" placeholder="Search...">
                                    <div class="input-group-append">
                                        <button class="btn" type="submit">
                                            <i class="fas fa-search"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Request List Table -->
                <div class="row">
                    <div class="col-lg-12">
                        <h3>Request List</h3>
                        <div class="table-responsive">
                            <table class="table table-striped m-0">
                                <thead class="head">
                                <tr>
                                    <th>ID</th>
                                    <th>Full Name</th>
                                    <th>Email</th>
                                    <th>Phone No.</th>
                                    <th>Request Status</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="request : ${requestList}" th:attr="onclick='redirectToDetail('+ ${request.id}+')'">
                                       <th scope="row" th:text="${request.id}"/>
                                       <th th:text="${request.fullName}"/>
                                       <th th:text="${request.requestEmail}"/>
                                       <th th:text="${request.requestPhone}"/>
                                       <td><button class="btn btn-closed" th:text="${request.requestMasterName}"/></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <nav class="pagination-container">
                    <ul class="pagination justify-content-center">
                        <li class="page-item disabled"><a class="page-link" href="#">Previous</a></li>
                        <li class="page-item"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                        <li class="page-item"><a class="page-link" href="#">Next</a></li>
                    </ul>
                </nav>

                <!-- Footer -->
                <footer class="footer">
                    <div class="container-fluid">
                        <div class="row">
                            <div class="col-md-12">2017 - 2020 &copy; Simple theme by <a href="#">Coderthemes</a></div>
                        </div>
                    </div>
                </footer>

            </div>
        </div>
    </div>
</div>

<!-- Vendor js -->
<script th:src="@{/admin_side/js/vendor.min.js}"></script>
<script th:src="@{/admin_side/js/app.min.js}"></script>
<script>
    function redirectToDetail(id) {
        window.location.href = "/admin/request-list-detail?id="+id;
    }
</script>
</body>
</html>
