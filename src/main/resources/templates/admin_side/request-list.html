<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <title>Request List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Responsive bootstrap 4 admin template" name="description"/>
    <meta content="Coderthemes" name="author"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>

    <!-- App favicon -->
    <link rel="shortcut icon" th:href="@{/user_side/images/logo1.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App css -->
    <link th:href="@{/admin_side/css/bootstrap.min.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/admin_side/css/icons.min.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/admin_side/css/app.min.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/admin_side/css/request-list.css}" rel="stylesheet" type="text/css"/>
    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css}">

</head>

<body id="body">

<div id="wrapper">

    <!-- Topbar Start -->
    <div th:insert="~{admin_side/top-sidebar :: topSidebar}"></div>
    <!-- end Topbar -->

    <!-- Left Sidebar Start -->
    <div th:replace="~{admin_side/left-sidebar :: leftSidebar}"></div>
    <!-- End Sidebar -->

    <div class="content-page">
        <div class="content">
            <div class="container-fluid">
                <div>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/manager/request-list}">Request Management</a>
                            </li>
                            <li class="breadcrumb-item active" aria-current="page">Request List</li>
                        </ol>
                    </nav>
                </div>
                <!-- Search Box -->
                <div class="row">
                    <div class="col-12">
                        <form class="app-search" th:action="@{/manager/searchRequestList}" method="get">
                            <div class="app-search-box">
                                <div class="input-group">
                                    <input type="text" class="form-control" name="keyword"
                                           placeholder="Search for request ...." value="">
                                    <div class="input-group-append">
                                        <button class="btn" type="submit" style="background-color: #1E90FF">
                                            <i class="fas fa-search"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Request List Table -->
                <div class="row">
                    <div class="col-lg-12">
                        <h3>Request List</h3>
                        <div class="table-responsive table-container">
                            <table class="table table-striped m-0">
                                <thead class="head">
                                <tr>
                                    <th>ID</th>
                                    <th>Full Name</th>
                                    <th class="email-column">Email</th>
                                    <th>Phone No.</th>
                                    <th>Request Status</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="request : ${requestList}"
                                    th:attr="onclick='redirectToDetail(' + ${request.id} + ',' + ${currentPage} + ')'">
                                    <th scope="row" th:text="${request.id}"/>
                                    <th th:text="${request.fullName}"/>
                                    <th class="email-column" th:text="${request.requestEmail}"/>
                                    <th th:text="${request.requestPhone}"/>
                                    <td>
                                        <button th:if="${request.requestMasterName == 'Open'}" class="btn btn-success btn-sm rounded-pill" style="min-width: 80px; font-size: 12px;" th:text="${request.requestMasterName}"></button>
                                        <button th:if="${request.requestMasterName != 'Open'}" class="btn btn-danger btn-sm rounded-pill" style="min-width: 80px; font-size: 12px;" th:text="${request.requestMasterName}"></button>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <th:block th:if="${numberPage > 0}">
                    <nav aria-label="Page navigation">
                        <ul class="pagination justify-content-end">
                            <li class="page-item">
                                <a class="page-link" href="#" data-page="${currentPage - 1}">Previous</a>
                            </li>
                            <!-- Page Numbers -->
                            <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, numberPage - 1)}"
                                th:classappend="${pageNum == currentPage} ? 'active'">
                                <button class="page-link pagination" th:data-page="${pageNum}"
                                        th:text="${pageNum + 1}"></button>
                            </li>
                            <!-- Next Button -->
                            <li class="page-item" th:classappend="${currentPage == numberPage - 1} ? 'disabled'">
                                <button class="page-link pagination" th:data-page="${currentPage + 1}"
                                        th:disabled="${currentPage == numberPage - 1}">
                                    Next
                                </button>
                            </li>
                        </ul>
                    </nav>
                </th:block>

                <div aria-live="polite" aria-atomic="true" style="position: fixed; bottom: 100px; right: 20px; z-index: 1050; width: 350px;">
                    <div id="myToast" class="toast" style="position: absolute; top: 0; right: 0;" data-delay="5000"
                         th:if="${message}">
                        <div class="toast-header">
                            <strong class="mr-auto">Notification</strong>
                            <button type="button" class="ml-2 mb-1 close" data-dismiss="toast" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                        <div class="toast-body" th:text="${message}">
                            Default message
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <footer class="footer">
                    <div class="container-fluid">
                        <div class="row">
                            <div class="col-md-12">2017 - 2020 &copy; Simple theme by <a href="#">Coderthemes</a></div>
                        </div>
                    </div>
                </footer>

            </div>
        </div>
    </div>
</div>

<!-- Vendor js -->
<script th:src="@{/admin_side/js/vendor.min.js}"></script>
<script th:src="@{/admin_side/js/app.min.js}"></script>
<script src="/admin_side/js/request-list.js"></script>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        var message = /*[[${message != null ? message : ''}]]*/ '';
        if (message.trim() !== '') {
            var toastElement = document.getElementById('myToast');
            if (toastElement) {
                var toast = new bootstrap.Toast(toastElement);
                toast.show();
            }
        }
    });
</script>
</body>
</html>
