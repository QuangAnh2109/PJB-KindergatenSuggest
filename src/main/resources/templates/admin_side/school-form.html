<!DOCTYPE html>
<html lang="en">


<!-- Mirrored from coderthemes.com/simple/layouts/vertical/forms-general.html by HTTrack Website Copier/3.x [XR&CO'2014], Wed, 28 Aug 2024 07:26:06 GMT -->

<head>
    <meta charset="utf-8"/>
    <title>Form Elements | Simple - Responsive Bootstrap 4 Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Responsive bootstrap 4 admin template" name="description"/>
    <meta content="Coderthemes" name="author"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <!-- App favicon -->
    <link rel="shortcut icon" th:href="@{/admin_side/images/favicon.ico}">
    <!-- App css -->
    <link th:href="@{/admin_side/css/bootstrap.min.css}" rel="stylesheet" type="text/css" id="bootstrap-stylesheet"/>
    <link th:href="@{/admin_side/css/icons.min.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/admin_side/css/app.min.css}" rel="stylesheet" type="text/css" id="app-stylesheet"/>

    <link th:href="@{/admin_side/css/request-list.css}" rel="stylesheet" type="text/css"/>
    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css}">
    <!-- Quill CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        .school-form tr {
            height: 60px;
        }
    </style>
</head>

<body>
<!-- Begin page -->
<div id="wrapper">

    <!-- Topbar Start -->
    <div th:replace="~{admin_side/top-sidebar :: topSidebar}"></div>
    <!-- end Topbar -->

    <!-- Left Sidebar Start -->
    <div th:replace="~{admin_side/left-sidebar :: leftSidebar}"></div>
    <!-- End Sidebar -->

    <!-- ============================================================== -->
    <!-- Start Page Content here -->
    <!-- ============================================================== -->

    <div class="content-page">
        <div class="content">
            <!-- start  -->
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item" style="color: black">School Management</li>
                        <li class="breadcrumb-item" style="color: black">Add new school</li>
                    </ol>
                </nav>
            </div>

            <div class="row">
                <div class="col-12">
                    <div>
                        <h5 class="header-title mb-3" style="font-size: 25px;">Add new school</h5>

                    </div>
                </div>
            </div>
            <!-- end row -->
            <div id="form-data">
                <table class="col-12 school-form">
                    <tr>
                        <td>School Name</td>
                        <td>
                            <input type="text" name="name" id="schoolName" class="form-control" placeholder="Enter School Name Here..."
                                   maxlength="255" >
                            <span id="schoolName-error" class="error-message" style="color:red; display:none;"></span>
                        </td>
                    </tr>
                    <tr>
                        <td>School Type</td>
                        <td>
                            <select name="type" id="typeId" class="form-control" >
                                <option value="" disabled selected>Select a school type</option>
                                <option th:each="schoolType:${schoolTypes}" th:value="${schoolType.typeKey}" th:text="${schoolType.typeValue}"></option>
                            </select>
                            <span id="type-error" class="error-message" style="color:red; display:none;"></span>
                        </td>
                    </tr>
                    <tr>
                        <td>Address</td>
                        <td>
                            <select onchange="loadDistrict(this.value)" id="city" name="city" class="form-control" >
                                <option value="" disabled selected>Province/City</option>
                                <option th:each="city:${citys}" th:value="${city.id}" th:text="${city.cityName}"></option>
                            </select>
                            <span id="city-error" class="error-message" style="color:red; display:none;"></span>
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>
                            <select onchange="loadWard(this.value)" name="district" id="district" class="form-control"
                                     disabled>
                                <option value="" disabled selected>District</option>
                            </select>
                            <span id="district-error" class="error-message" style="color:red; display:none;"></span>
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>
                            <select onchange="enableParam('address')" name="ward" id="ward" class="form-control"
                                     disabled>
                                <option value="" disabled selected>Ward</option>
                            </select>
                            <span id="ward-error" class="error-message" style="color:red; display:none;"></span>
                        </td>
                    </tr>
                    <tr>
                        <td>

                        </td>
                        <td>
                            <input type="text" name="address" id="address" class="form-control"
                                   placeholder="Enter School Address Here..." maxlength="255"  disabled>
                            <span id="address-error" class="error-message" style="color:red; display:none;"></span>
                        </td>
                    </tr>
                    <tr>
                        <td>Email</td>
                        <td>
                            <input id="email" type="email" name="email" class="form-control"
                                   placeholder="Enter School Email Here..." th:pattern="${emailRegex}" >
                            <span id="email-error" class="error-message" style="color:red; display:none;"></span>
                        </td>
                    </tr>
                    <tr>
                        <td>Phone No.</td>
                        <td>
                            <input id="phone" type="text" name="phone" class="form-control"
                                   placeholder="Enter Phone Number Here..." th:pattern="${phoneRegex}" >
                            <span id="phone-error" class="error-message" style="color:red; display:none;"></span>
                        </td>
                    </tr>
                    <tr>
                        <td>Child-receiving age</td>
                        <td>
                            <select id="childReceivingAge" class="form-control" name="age" >
                                <option value="" disabled selected>Select Child-Receiving Age</option>
                                <option th:each="age:${childReceivingAges}" th:value="${age.typeKey}"
                                        th:text="${age.typeValue}">
                            </select>
                            <span id="childReceivingAge-error" class="error-message" style="color:red; display:none;"></span>
                        </td>
                    </tr>
                    <tr>
                        <td>Education method</td>
                        <td>
                            <select id="educationMethod" class="form-control" name="educationMethod" >
                                <option value="" disabled selected>Select Education Method</option>
                                <option th:each="method:${educationMethods}" th:value="${method.typeKey}"
                                        th:text="${method.typeValue}">
                            </select>
                            <span id="educationMethod-error" class="error-message" style="color:red; display:none;"></span>
                        </td>
                    </tr>
                    <tr>
                        <td>Fee/month(VND)</td>
                        <td class="row">
                            <label class="col-1 col-form-label">From</label>
                            <input id="feeFrom" name="feeFrom" class="col-3 form-control" type="number" pattern="[0-9]+" >
                            <label class="col-1 col-form-label">To</label>
                            <input id="feeTo" name="feeTo" class="col-3 form-control" type="number" pattern="[0-9]+" >
                            <span id="feeTo-error" class="error-message col-12" style="color:red; display:none;"></span>
                            <span id="feeFrom-error" class="error-message col-12" style="color:red; display:none;"></span>
                            <span id="fee-error" class="error-message col-12" style="color:red; display:none;"></span>
                        </td>
                    </tr>
                    <tr>
                        <td>Facilities</td>
                        <td class="row" style="margin-left: 0px;">
                            <div th:each="facility:${facilities}" class="checkbox checkbox-success"
                                 style="margin-left: 12px;">
                                <input th:id="'facility-checkbox' + ${facility.typeKey}"
                                       th:value="${facility.typeKey}" name="schoolFacilities" type="checkbox">
                                <label th:for="'facility-checkbox' + ${facility.typeKey}"
                                       th:text="${facility.typeValue}">
                                </label>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>Utilites</td>
                        <td class="row" style="margin-left: 0px;">
                            <div th:each="utility:${utilities}" class="checkbox checkbox-success"
                                 style="margin-left: 12px;">
                                <input th:id="'utility-checkbox' + ${utility.typeKey}" th:value="${utility.typeKey}"
                                       name="schoolUtilities" type="checkbox">
                                <label th:for="'utility-checkbox' + ${utility.typeKey}"
                                       th:text="${utility.typeValue}">
                                </label>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>School Introduction</td>
                        <td>
                            <div id="editor"></div>
                            <span id="introduction-error" class="error-message" style="color:red; display:none;"></span>
                        </td>
                    </tr>
                    <tr>
                        <td>School Image</td>
                        <td>
                            <input name="image" type="file" class="form-control" id="image"
                                   accept="image/gif, image/jpeg, image/png"/>
                            <span id="image-error" class="error-message" style="color:red; display:none;"></span>
                        </td>
                    </tr>
                </table>
                <div style="margin-top: 30px; padding-bottom: 30px">
                    <a href="/manager/school-list"><button id="cancel" class="btn btn-primary" style="background-color: white;color: #458bc4;">Cancel</button></a>
                    <button id="save" class="btn btn-primary" onclick="addNewSchool(1)">Save draft</button>
                    <button id="submit" class="btn btn-primary" onclick="addNewSchool(2)">Submit</button>
                </div>
            </div>
            <!-- end row -->


            <!-- Footer Start -->
            <footer class="footer">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-md-12">
                            2017 - 2020 &copy; Simple theme by <a href="#">Coderthemes</a>
                        </div>
                    </div>
                </div>
            </footer>
            <!-- end Footer -->

        </div>
        <!-- end content -->

    </div>
    <!-- END content-page -->

</div>
<!-- END wrapper -->

<!-- popup 1 -->
<div id="notificationModel" class="modal fade" tabindex="-1" role="dialog"
     aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Notification</h5>
            </div>
            <div class="modal-body">
                <h6 id="msg-popup-1"></h6>

            </div>
            <div class="modal-footer">
                <button type="button" id="button-popup-1" class="btn btn-secondary waves-effect"
                        data-dismiss="modal">Close
                </button>
            </div>
        </div>
        <!-- /.modal-content -->
    </div>
    <!-- /.modal-dialog -->
</div>
<!-- END popup 1 -->

<!-- Vendor js -->
<script src="/admin_side/js/vendor.min.js"></script>

<!-- App js -->
<script src="/admin_side/js/app.min.js"></script>

<!-- Quill JS -->
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<script>
    var quill = new Quill('#editor', {
        theme: 'snow',
        placeholder: 'Write something...',
    });
</script>

<!-- Jquery js -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="/admin_side/js/address-load.js"></script>
<script src="/admin_side/js/create-new-school.js"></script>
</body>

</html>
