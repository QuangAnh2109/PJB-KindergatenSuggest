<!DOCTYPE html>
<html lang="en">


<!-- Mirrored from coderthemes.com/simple/layouts/vertical/tables-basic.html by HTTrack Website Copier/3.x [XR&CO'2014], Wed, 28 Aug 2024 07:26:12 GMT -->
<head>
    <meta charset="utf-8" />
    <title>Basic Tables | Simple - Responsive Bootstrap 4 Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Responsive bootstrap 4 admin template" name="description" />
    <meta content="Coderthemes" name="author" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- App favicon -->
    <link rel="shortcut icon" th:href="@{/admin_side/images/favicon.ico}">
    <!-- App css -->
    <link th:href="@{/admin_side/css/bootstrap.min.css}" rel="stylesheet" type="text/css" id="bootstrap-stylesheet" />
    <link th:href="@{/admin_side/css/icons.min.css}" rel="stylesheet" type="text/css" />
    <link th:href="@{/admin_side/css/app.min.css}" rel="stylesheet" type="text/css" id="app-stylesheet" />

    <link th:href="@{/admin_side/css/request-list.css}" rel="stylesheet" type="text/css"/>
    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css}">
    <style>
        .button-search{
            pointer-events: auto;
            cursor: pointer;
        }
    </style>
</head>

<body>

<!-- Begin page -->
<div id="wrapper">


    <!-- Topbar Start -->
    <div th:replace="~{admin_side/top-sidebar :: topSidebar}"></div>
    <!-- end Topbar -->

    <!-- Left Sidebar Start -->
    <div th:replace="~{admin_side/left-sidebar :: leftSidebar}"></div>
    <!-- End Sidebar -->

    <!-- ============================================================== -->
    <!-- Start Page Content here -->
    <!-- ============================================================== -->

    <div class="content-page">
        <div class="content" th:fragment="main-content" id="main-content-school-table">

            <!-- Start container-fluid -->
            <div class="container-fluid">

                <!-- start  -->
                <div class="row">
                    <div class="col-12">
                        <div>
                            <h4 class="header-title mb-3">School Management > School List</h4>
                        </div>
                    </div>
                </div>
                <!-- end row -->

                <!-- row -->
                <div class="row justify-content-start" style="padding-bottom: 10px;">
                    <div class="col-lg-6">
                        <div class="mt-5 mt-lg-0">
                            <h5 style="font-size: 25px;">School list</h5>
                        </div>
                    </div>
                    <div class="col-lg-2">

                    </div>
                    <div class="col-lg-4" style="padding-right: 0px;">
                        <form class="app-search" onsubmit="loadSchoolListForSearch()">
                            <div class="app-search-box">
                                <div class="input-group">
                                    <input id="search" type="text" class="form-control" placeholder="Search...">
                                    <div class="input-group-append">
                                        <button class="btn btn-primary" type="submit">
                                            <i class="fas fa-search"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="col-lg-11">
                    </div>
                    <button class="col-lg-1 btn btn-primary">Add school</button>
                </div>
                <!-- end row -->
                <div class="table-responsive">
                    <table class="table table-striped m-0">
                        <thead>
                        <tr>
                            <th>School Name</th>
                            <th>Address</th>
                            <th>Phone No.</th>
                            <th>Email</th>
                            <th>Posted Date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody id="school-table">
                        <tr th:each="school:${schoolList}" style="height: 80px">
                            <th scope="row" th:text="${school.schoolName}"></th>
                            <td th:text="${school.schoolAddress}"></td>
                            <td th:text="${school.schoolPhone}"></td>
                            <td th:text="${school.schoolEmail}"></td>
                            <td th:text="${#temporals.format(school.postedDate, 'yyyy-MM-dd HH:mm:ss')}"></td>
                            <td th:each="sta:${status}" th:if="${sta.typeKey == school.getStatusId()}" th:text="${sta.getTypeValue()}"></td>
                            <td class="row">
                                <a th:if="${school.statusId != 7}" href="#" ><h4 class="col mdi mdi-file-document-edit-outline"></h4></a>
                                <a th:if="${school.canDelete}" href="#" ><h4 class="col mdi mdi-delete-outline"></h4></a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div id="page-bar">
                    <th:block th:if="${schoolList.getTotalPages() > 0}">
                        <nav aria-label="Page navigation">
                            <ul class="pagination justify-content-end">
                                <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, schoolList.getTotalPages() - 1)}" th:id="${'page'+pageNum}"
                                    th:classappend="${pageNum == 0} ? 'active'">
                                    <a class="page-link button-search" th:onclick="'loadSchoolInPage('+${pageNum}+','+${isAdmin}+')'"
                                       th:text="${pageNum + 1}"></a>
                                </li>
                            </ul>
                        </nav>
                    </th:block>
                </div>
            </div>
            <!-- end container-fluid -->



            <!-- Footer Start -->
            <footer class="footer">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-md-12">
                            2017 - 2020 &copy; Simple theme by <a href="#">Coderthemes</a>
                        </div>
                    </div>
                </div>
            </footer>
            <!-- end Footer -->

        </div>
        <!-- end content -->

    </div>
    <!-- END content-page -->

</div>
<!-- END wrapper -->


<!-- Right Sidebar -->
<div class="right-bar">
    <div class="rightbar-title">
        <a href="javascript:void(0);" class="right-bar-toggle float-right">
            <i class="mdi mdi-close"></i>
        </a>
        <h5 class="font-16 m-0 text-white">Theme Customizer</h5>
    </div>
    <div class="slimscroll-menu">

        <div class="p-4">
            <div class="alert alert-warning" role="alert">
                <strong>Customize </strong> the overall color scheme, layout, etc.
            </div>
            <div class="mb-2">
                <img src="/admin_side/images/layouts/light.png" class="img-fluid img-thumbnail" alt="">
            </div>
            <div class="custom-control custom-switch mb-3">
                <input type="checkbox" class="custom-control-input theme-choice" id="light-mode-switch" checked />
                <label class="custom-control-label" for="light-mode-switch">Light Mode</label>
            </div>

            <div class="mb-2">
                <img src="/admin_side/images/layouts/dark.png" class="img-fluid img-thumbnail" alt="">
            </div>
            <div class="custom-control custom-switch mb-3">
                <input type="checkbox" class="custom-control-input theme-choice" id="dark-mode-switch" data-bsStyle="/admin_side/css/bootstrap-dark.min.css"
                       data-appStyle="/admin_side/css/app-dark.min.css" />
                <label class="custom-control-label" for="dark-mode-switch">Dark Mode</label>
            </div>

            <div class="mb-2">
                <img src="/admin_side/images/layouts/rtl.png" class="img-fluid img-thumbnail" alt="">
            </div>
            <div class="custom-control custom-switch mb-5">
                <input type="checkbox" class="custom-control-input theme-choice" id="rtl-mode-switch" data-appStyle="/admin_side/css/app-rtl.min.css" />
                <label class="custom-control-label" for="rtl-mode-switch">RTL Mode</label>
            </div>

            <a href="https://1.envato.market/EK71X" class="btn btn-danger btn-block mt-3" target="_blank"><i class="mdi mdi-download mr-1"></i> Download Now</a>
        </div>
    </div> <!-- end slimscroll-menu-->
</div>
<!-- /Right-bar -->

<!-- Right bar overlay-->
<div class="rightbar-overlay"></div>

<a href="javascript:void(0);" class="right-bar-toggle demos-show-btn">
    <i class="mdi mdi-settings-outline mdi-spin"></i> &nbsp;Choose Demos
</a>

<!-- Vendor js -->
<script src="/admin_side/js/vendor.min.js"></script>

<!-- App js -->
<script src="/admin_side/js/app.min.js"></script>
<script src="/admin_side/js/school-load.js"></script>
</body>

</html>
