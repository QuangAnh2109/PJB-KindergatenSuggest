<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<!-- Mirrored from coderthemes.com/simple/layouts/vertical/tables-basic.html by HTTrack Website Copier/3.x [XR&CO'2014], Wed, 28 Aug 2024 07:26:12 GMT -->

<head>
    <meta charset="utf-8" />
    <title>Basic Tables | Simple - Responsive Bootstrap 4 Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Responsive bootstrap 4 admin template" name="description" />
    <meta content="Coderthemes" name="author" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- App favicon -->
    <link rel="shortcut icon" th:href="@{/admin_side/images/favicon.ico}">

    <!-- App css -->
    <link th:href="@{/admin_side/css/bootstrap.min.css}" rel="stylesheet" type="text/css" id="bootstrap-stylesheet" />
    <link th:href="@{/admin_side/css/icons.min.css}" rel="stylesheet" type="text/css" />
    <link th:href="@{/admin_side/css/app.min.css}" rel="stylesheet" type="text/css" id="app-stylesheet" />

    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css}">
    <style>
        .button-search{
            pointer-events: auto;
            cursor: pointer;
        }
        .logout-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 20px;
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            color: #3498db;
            margin-top: 20px;
        }

        .logout-btn i {
            font-size: 22px;
            color: #333;
        }
        .table-wrapper {
            max-height: 600px;
            overflow-y: auto;
            overflow-x: auto;
        }

        .table {
            width: 100%;
            table-layout: auto;
        }
    </style>
</head>

<body>

<!-- Begin page -->
<div id="wrapper">


    <!-- Topbar Start -->
    <div th:replace="~{admin_side/top-sidebar :: topSidebar}"></div>
    <!-- end Topbar -->

    <!-- Left Sidebar Start -->
    <div th:replace="~{admin_side/left-sidebar :: leftSidebar}"></div>
    <!-- End Sidebar -->

    <!-- ============================================================== -->
    <!-- Start Page Content here -->
    <!-- ============================================================== -->

    <div class="content-page">
        <div class="content">

            <!-- Start container-fluid -->
            <div class="container-fluid">

                <!-- start  -->
                <div>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item" style="color: black">School Management</li>
                            <li class="breadcrumb-item" style="color: black">School List</li>
                        </ol>
                    </nav>
                </div>
                <!-- end row -->

                <!-- row -->
                <div class="row justify-content-start" style="padding-bottom: 10px;">
                    <div class="col-lg-6">
                        <div class="mt-5 mt-lg-0">
                            <h5 style="font-size: 25px;">School list</h5>
                        </div>
                    </div>
                    <div class="col-lg-4">

                    </div>
                    <div class="col-lg-2" style="padding-right: 0px;">
                        <div class="app-search-box" style="max-width: 100%">
                            <div class="input-group">
                                <input id="enter-search" type="text" class="form-control" placeholder="Search..."  style="max-width: 100%">
                                <input id="search" value="" hidden>
                                <div class="input-group-append">
                                    <button class="btn btn-primary" id="search-button">
                                        <i class="fas fa-search"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-11">
                    </div>
                    <a class="col-lg-1" sec:authorize="hasAuthority('School owner')" th:href="${serverLink+'/school-owner/school/form'}"><button class="col-12 btn btn-primary">Add school</button></a>
                </div>
                <!-- end row -->
                <div th:fragment="main-content" id="main-content-school-table">
                    <div class="table-responsive table-wrapper">
                        <table class="table table-striped m-0">
                            <thead>
                            <tr>
                                <th>School Name</th>
                                <th>Address</th>
                                <th>Phone No.</th>
                                <th>Email</th>
                                <th>Posted Date</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                            </thead>
                            <tbody id="school-table">
                            <tr th:each="school:${schoolList}" style="height: 80px">
                                <th scope="row" th:text="${school.schoolName}"></th>
                                <td th:text="${school.schoolAddress + ', ' + school.ward + ', ' + school.district + ', ' + school.city}"></td>
                                <td th:text="${school.schoolPhone}"></td>
                                <td th:text="${school.schoolEmail}"></td>
                                <td th:text="${#temporals.format(school.postedDate, 'yyyy-MM-dd HH:mm:ss')}"></td>
                                <td th:each="sta:${status}" th:if="${sta.typeKey == school.getStatusId()}" th:text="${sta.getTypeValue()}"></td>
                                <td class="row">
                                    <a th:if="${school.statusId != 7}" th:href="${serverLink+'/manager/school/view-detail?id=' + school.schoolId}"><h4 class="col mdi mdi-file-document-edit-outline"></h4></a>
                                    <a th:if="${school.canDelete}" class="button-search"><h4 class="col mdi mdi-delete-outline" th:onclick="'deleteSchool(' + ${school.schoolId} + ', ' + ${school.recordNo} + ')'"></h4></a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                        <div id="noResultsMessage" th:if="${schoolList.getNumberOfElements() == 0}"
                             class="alert alert-warning"
                             role="alert">
                            <span th:text="#{ME_012}">No results found.</span>
                        </div>
                    </div>
                    <div id="page-bar">
                        <th:block th:if="${schoolList.getTotalPages() > 0}">
                            <nav aria-label="Page navigation">
                                <ul class="pagination justify-content-end">
                                    <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, schoolList.getTotalPages() - 1)}" th:id="${'page'+pageNum}"
                                        th:classappend="${pageNum == currentPage} ? 'active'">
                                        <a class="page-link button-search" th:onclick="'loadSchoolInPage('+${pageNum}+')'"
                                           th:text="${pageNum + 1}"></a>
                                    </li>
                                </ul>
                            </nav>
                        </th:block>
                    </div>
                </div>
            </div>
            <!-- end container-fluid -->



            <!-- Footer Start -->
            <footer class="footer">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-md-12">
                            2017 - 2020 &copy; Simple theme by <a href="#">Coderthemes</a>
                        </div>
                    </div>
                </div>
            </footer>
            <!-- end Footer -->

        </div>
        <!-- end content -->

    </div>
    <!-- END content-page -->

</div>
<!-- END wrapper -->

<!-- popup 1 -->
<div id="searchModel" class="modal fade" tabindex="-1" role="dialog"
     aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Notification</h5>
            </div>
            <div class="modal-body">
                <h6 th:text="#{ME_012}"></h6>

            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary waves-effect"
                        data-dismiss="modal">Close
                </button>
            </div>
        </div>
        <!-- /.modal-content -->
    </div>
    <!-- /.modal-dialog -->
</div>
<!-- END popup 1 -->

<!-- popup 2 -->
<div id="deleteModel" class="modal fade" tabindex="-1" role="dialog"
     aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Notification</h5>
            </div>
            <div class="modal-body">
                <h6 id="msg" th:text="#{ME_080}"></h6>

            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary waves-effect"
                        data-dismiss="modal">Close
                </button>
            </div>
        </div>
        <!-- /.modal-content -->
    </div>
    <!-- /.modal-dialog -->
</div>
<!-- END popup 2 -->


<!-- Vendor js -->
<script src="/admin_side/js/vendor.min.js"></script>

<!-- App js -->
<script src="/admin_side/js/app.min.js"></script>
<script src="/admin_side/js/school-load.js"></script>
<script src="/admin_side/js/school-detail-update.js"></script>
<script>
    document.getElementById("enter-search").addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            document.getElementById("search").value = document.getElementById("enter-search").value;
            loadSchoolInPage(0);
        }
    });

    document.getElementById("search-button").addEventListener("click", function (){
        document.getElementById("search").value = document.getElementById("enter-search").value;
        loadSchoolInPage(0);
    });

    function deleteSchool (schoolId, recordNo){
        changeSchoolStatus('/manager', 'delete', schoolId, recordNo);
    }
</script>
</body>

</html>
