<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>form Advanced | Simple - Responsive Bootstrap 4 Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Responsive bootstrap 4 admin template" name="description"/>
    <meta content="Coderthemes" name="author"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <!-- App favicon -->
    <link rel="shortcut icon" th:href="@{/admin_side/images/favicon.ico}">
    <!-- Plugin css -->
    <link th:href="@{/admin_side/libs/bootstrap-tagsinput/bootstrap-tagsinput.css}" rel="stylesheet"/>
    <link th:href="@{/admin_side/libs/switchery/switchery.min.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/admin_side/libs/select2/select2.min.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/admin_side/libs/clockpicker/bootstrap-clockpicker.min.css}" rel="stylesheet">
    <link th:href="@{/admin_side/libs/bootstrap-timepicker/bootstrap-timepicker.min.css}" rel="stylesheet"
          type="text/css"/>
    <link th:href="@{/admin_side/libs/bootstrap-colorpicker/bootstrap-colorpicker.min.css}" rel="stylesheet"
          type="text/css"/>
    <link th:href="@{/admin_side/libs/bootstrap-datepicker/bootstrap-datepicker.css}" rel="stylesheet">
    <link th:href="@{/admin_side/libs/bootstrap-daterangepicker/daterangepicker.css}" rel="stylesheet">
    <!-- Summernote css -->
    <link th:href="@{/admin_side/libs/summernote/summernote-bs4.css}" rel="stylesheet" type="text/css"/>
    <!-- App css -->
    <link th:href="@{/admin_side/css/bootstrap.min.css}" rel="stylesheet" type="text/css" id="bootstrap-stylesheet"/>
    <link th:href="@{/admin_side/css/icons.min.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/admin_side/css/app.min.css}" rel="stylesheet" type="text/css" id="app-stylesheet"/>
    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css}">

    <style>
        .btn-closed {
            background-color: #E6FAE6;
            color: #0b5ed7;
            border: 2px solid #555;
            border-radius: 20px;
            padding: 5px 15px;
            font-weight: bold;
            transition: all 0.3s ease-in-out;
        }

        .btn-closed:hover {
            border-color: #333;
            background-color: #D4F5D4;
        }

        .app-search {
            display: flex;
            justify-content: flex-end;
        }

        .app-search-box {
            max-width: 300px;
        }

        .app-search .form-control {
            border-radius: 20px;
            border: 2px solid #ccc;
            padding: 10px 15px;
        }

        .app-search .btn {
            background-color: #28a745;
            color: white;
            border-radius: 20px;
            padding: 8px 15px;
            border: none;
        }

        .pagination-container {
            margin-top: 20px;
        }

        .logout-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 20px;
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            color: #3498db;
            margin-top: 20px;
        }

        .logout-btn i {
            font-size: 22px;
            color: #333;
        }
        .btn-closed {
            font-size: 12px; /* Giảm kích thước chữ */
            padding: 3px 10px; /* Giảm padding */
            border-radius: 15px; /* Giảm độ bo tròn */
            min-width: 70px; /* Đặt chiều rộng tối thiểu */
            text-align: center;
        }
    </style>
    
</head>

<body>

<!-- Begin page -->
<div id="wrapper">


    <!-- Topbar Start -->
    <div class="navbar-custom">
        <div class="logo-box">
            <a href="index.html" class="logo text-center logo-dark">
                <span class="logo-lg">
                    <img th:src="@{/user_side/images/logo1.png}" alt="Logo" width="100" height="100">
                </span>
            </a>
        </div>
        <div class="logout-container">
            <a href="#" class="logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </a>
        </div>
    </div>
    <!-- end Topbar -->
    <!-- ========== Left Sidebar Start ========== -->
    <div class="left-side-menu">

        <!--- Sidemenu -->
        <div id="sidebar-menu">

            <ul class="metismenu" id="side-menu">

                <li class="menu-title">Navigation</li>

                <li>
                    <a th:href="@{/admin/home}">
                        <i class="ti-home"></i>
                        <span> School Management </span>
                    </a>
                </li>

                <li>
                    <a th:href="@{/admin/user-list}">
                        <i class="ti-user"></i>
                        <span> User Management </span>
                    </a>
                </li>

                <li>
                    <a th:href="@{/manager/request-reminder}">
                        <i class="ti-bell"></i>
                        <span> Reminder </span>
                    </a>
                </li>

                <li>
                    <a th:href="@{/manager/parent-list}">
                        <i class="ti-face-smile"></i>
                        <span> Parent Management </span>
                    </a>
                </li>

                <li>
                    <a th:href="@{/manager/request-list}">
                        <i class="ti-email"></i>
                        <span> Request Management </span>
                    </a>
                </li>

            </ul>

        </div>
        <!-- End Sidebar -->

        <div class="clearfix"></div>

    </div>
    <!-- Left Sidebar End -->

    <!-- ============================================================== -->
    <!-- Start Page Content here -->
    <!-- ============================================================== -->

    <div class="content-page">
        <div class="content">
            <div class="container-fluid">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/admin/user-list}">User Management</a></li>
                        <li class="breadcrumb-item">UserList</li>
                        <li class="breadcrumb-item active" aria-current="page">User Details</li>
                    </ol>
                </nav>

                <div th:if="${message}" class="alert alert-success" role="alert">
                    <span th:text="${message}"></span>
                </div>
                <div th:if="${error}" class="alert alert-danger" role="alert">
                    <span th:text="${error}"></span>
                </div>

                <div>
                    <div class="mt-5">
                        <h4 class="header-title mb-3">User Details</h4>
                        <div>
                            <div class="form-group">
                                <label for="fullName">Full Name</label>
                                <p id="fullName" class="form-control" th:text="${user.fullName}"></p>
                            </div>
                            <div class="form-group">
                                <label for="email">Email</label>
                                <p id="email" class="form-control" th:text="${user.email}"></p>
                            </div>
                            <div class="form-group">
                                <label for="dob">DOB</label>
                                <p id="dob" class="form-control" th:text="${user.dob}"></p>
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone No.</label>
                                <p id="phone" class="form-control" th:text="${user.phone}"></p>
                            </div>
                            <div class="form-group">
                                <label for="role">Role</label>
                                <p id="role" class="form-control" th:text="${user.role}"></p>
                            </div>
                            <div class="form-group">
                                <label for="status">Status</label>
                                <p id="status" class="form-control" th:text="${user.status}"></p>
                            </div>

                            <div class="form-group text-right mb-0">
                                <form th:action="@{/admin/user-detail/{id}/toggleStatus(id=${user.id})}" method="post"
                                      class="d-inline">
                                    <button type="submit" class="btn waves-effect"
                                            th:classappend="${user.status == 'Active'} ? 'btn-warning' : 'btn-success'"
                                            th:text="${user.status == 'Active'} ? 'Deactivate' : 'Activate'">
                                    </button>
                                </form>
                                <a th:href="@{/admin/user-list}" class="btn btn-danger waves-effect">
                                    Cancel
                                </a>
                                <a th:href="@{/admin/edit-user/{id}(id=${user.id})}" class="btn btn-facebook waves-effect">
                                    Edit
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
<!-- END wrapper -->


<!-- Vendor js -->
<script src="/admin_side/js/vendor.min.js"></script>
<script src="/admin_side/libs/moment/moment.min.js"></script>
<script src="/admin_side/libs/bootstrap-tagsinput/bootstrap-tagsinput.min.js"></script>
<script src="/admin_side/libs/switchery/switchery.min.js"></script>
<script src="/admin_side/libs/select2/select2.min.js"></script>
<script src="/admin_side/libs/parsleyjs/parsley.min.js"></script>
<script src="/admin_side/libs/bootstrap-filestyle2/bootstrap-filestyle.min.js"></script>
<script src="/admin_side/libs/bootstrap-timepicker/bootstrap-timepicker.min.js"></script>
<script src="/admin_side/libs/bootstrap-colorpicker/bootstrap-colorpicker.min.js"></script>
<script src="/admin_side/libs/clockpicker/bootstrap-clockpicker.min.js"></script>
<script src="/admin_side/libs/bootstrap-datepicker/bootstrap-datepicker.min.js"></script>
<script src="/admin_side/libs/bootstrap-daterangepicker/daterangepicker.js"></script>
<!-- Summernote js -->
<script src="/admin_side/libs/summernote/summernote-bs4.min.js"></script>

<!-- Init js-->
<script src="/admin_side/js/pages/form-advanced.init.js"></script>

<!-- App js -->
<script src="/admin_side/js/app.min.js"></script>
<script src="/admin_side/js/UserDetails.js"></script>

</body>


</html>
