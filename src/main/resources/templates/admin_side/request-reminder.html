<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <title>Dashboard | Simple - Responsive Bootstrap 4 Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Responsive bootstrap 4 admin template" name="description"/>
    <meta content="Coderthemes" name="author"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>

    <!-- App favicon -->
    <link rel="shortcut icon" th:href="@{/admin_side/images/favicon.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App css -->
    <link th:href="@{/admin_side/css/bootstrap.min.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/admin_side/css/icons.min.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/admin_side/css/app.min.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/admin_side/css/request-reminder.css}" rel="stylesheet" type="text/css"/>
    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css}">
`</head>

<body>

<div id="wrapper">

    <!-- Topbar Start -->
    <div th:replace="~{admin_side/top-sidebar :: topSidebar}"></div>
    <!-- end Topbar -->

    <!-- Left Sidebar Start -->
    <div th:replace="~{admin_side/left-sidebar :: leftSidebar}"></div>
    <!-- End Sidebar -->

    <div class="content-page">
        <div class="content">
            <div class="container-fluid">
                <div>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/manager/request-reminder}">Reminder</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Request Reminder</li>
                        </ol>
                    </nav>
                </div>
                <!-- Search Box -->
                <div class="row">
                    <div class="col-12">
                        <form class="app-search" th:action="@{/manager/searchRequestReminder}" method="get">
                            <div class="app-search-box">
                                <div class="input-group">
                                    <input type="text" class="form-control" placeholder="Search for request...."
                                           name="keyword">
                                    <div class="input-group-append">
                                        <button class="btn" type="submit">
                                            <i class="fas fa-search"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Request List Table -->
                <div class="row">
                    <div class="col-lg-12">
                        <h3>Request Reminder</h3>
                        <div class="table-responsive">
                            <table class="table table-striped m-0">
                                <thead class="head">
                                <tr>
                                    <th>ID</th>
                                    <th>Full Name</th>
                                    <th>Email</th>
                                    <th>Phone No.</th>
                                    <th>Request Status</th>
                                    <th>Action</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="request : ${requestList}"
                                    th:attr="onclick='redirectToDetail('+ ${request.id}+')'">
                                    <th scope="row" th:text="${request.id}"/>
                                    <th th:text="${request.fullName}"/>
                                    <th th:text="${request.requestEmail}"/>
                                    <th th:text="${request.requestPhone}"/>
                                    <td>
                                        <button class="btn btn-closed" th:text="${request.requestMasterName}"/>
                                    </td>
                                    <td>
                                        <a style="text-decoration: underline"
                                           th:href="@{/manager/request-list-detail(id=${request.id}, page='Detail')}">
                                            Go to review
                                        </a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <th:block th:if="${numberPage > 0}">
                    <nav aria-label="Page navigation">
                        <ul class="pagination justify-content-end">
                            <!-- Previous Button -->
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link" th:if="${currentPage > 0}"
                                   th:href="@{'?currentPage=' + ${currentPage - 1}}">Previous</a>
                            </li>

                            <!-- Page Numbers -->
                            <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, numberPage - 1)}"
                                th:classappend="${pageNum == currentPage} ? 'active'">
                                <a class="page-link" th:href="@{'?currentPage=' + ${pageNum}}"
                                   th:text="${pageNum + 1}"></a>
                            </li>

                            <!-- Next Button -->
                            <li class="page-item" th:classappend="${currentPage == numberPage - 1} ? 'disabled'">
                                <a class="page-link" th:if="${currentPage < numberPage - 1}"
                                   th:href="@{'?currentPage=' + ${currentPage + 1}}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </th:block>
                <div aria-live="polite" aria-atomic="true" style="position: relative; min-height: 200px;">
                    <div id="myToast" class="toast" style="position: absolute; top: 0; right: 0;" data-delay="5000"
                         th:if="${message}">
                        <div class="toast-header">
                            <strong class="mr-auto">Notification</strong>
                            <button type="button" class="ml-2 mb-1 close" data-dismiss="toast" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                        <div class="toast-body" th:text="${message}">
                            Default message
                        </div>
                    </div>
                </div>
                <!-- Footer -->
                <footer class="footer">
                    <div class="container-fluid">
                        <div class="row">
                            <div class="col-md-12">2017 - 2020 &copy; Simple theme by <a href="#">Coderthemes</a></div>
                        </div>
                    </div>
                </footer>

            </div>
        </div>
    </div>
</div>

<!-- Vendor js -->
<script th:src="@{/admin_side/js/vendor.min.js}"></script>
<script th:src="@{/admin_side/js/app.min.js}"></script>
<script src="/admin_side/js/request-reminder.js"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        var message = /*[[${message != null ? message : ''}]]*/ '';
        if (message.trim() !== '') {
            var toastElement = document.getElementById('myToast');
            if (toastElement) {
                var toast = new bootstrap.Toast(toastElement);
                toast.show();
            }
        }
    });
</script>

</body>
</html>
