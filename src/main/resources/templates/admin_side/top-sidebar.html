<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="navbar-custom" th:fragment="topSidebar">
    <div class="logo-box">
        <a href="#" class="logo text-center logo-dark">
                <span class="logo-lg">
                    <img th:src="@{/user_side/images/logo1.png}" alt="Logo" width="100" height="100">
                </span>
        </a>
    </div>
    <ul class="list-unstyled topnav-menu topnav-menu-left m-0" style="display: flex; justify-content: space-between">
        <li>
            <button class="button-menu-mobile">
                <i class="mdi mdi-menu"></i>
            </button>
        </li>
        <li class="logout-container" style="margin-left: auto">
            <button class="logout-btn" style="border: none; outline: none; background: none; cursor: pointer;"
                    data-toggle="modal" data-target="#exampleModal1">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </button>
        </li>
    </ul>

    <!-- Modal -->
    <div class="modal fade" id="exampleModal1" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
         aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm" role="document">
            <div class="modal-content border-0 shadow-lg rounded-4"> <!-- Hiệu ứng bóng & bo góc -->
                <div class="modal-header bg-primary text-white text-center">
                    <h5 class="modal-title w-100 fw-bold" id="exampleModalLabel">Confirm Logout</h5>
                </div>
                <div class="modal-body text-center fs-5">
                    Are you sure you want to log out?
                </div>
                <div class="modal-footer d-flex justify-content-center gap-3">
                    <button type="button" class="btn btn-danger w-45 py-2 fw-bold rounded" style="width: 80px" data-dismiss="modal">No</button>
                    <form id="logoutForm" th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-success w-500 py-2 fw-bold rounded" style="width: 80px">Yes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
