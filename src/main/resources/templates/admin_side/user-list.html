<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <title>List of Users Account </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Responsive bootstrap 4 admin template" name="description"/>
    <meta content="Coderthemes" name="author"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>

    <!-- App favicon -->
    <link rel="shortcut icon" th:href="@{/admin_side/images/favicon.ico}">
    <!-- third party css -->
    <link th:href="@{/admin_side/libs/datatables/dataTables.bootstrap4.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/admin_side/libs/datatables/buttons.bootstrap4.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/admin_side/libs/datatables/responsive.bootstrap4.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/admin_side/libs/datatables/select.bootstrap4.css}" rel="stylesheet" type="text/css"/>
    <!-- App css -->
    <link th:href="@{/admin_side/css/bootstrap.min.css}" rel="stylesheet" type="text/css" id="bootstrap-stylesheet"/>
    <link th:href="@{/admin_side/css/icons.min.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/admin_side/css/app.min.css}" rel="stylesheet" type="text/css" id="app-stylesheet"/>
    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css}">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/admin_side/css/user-list.css}" type="text/css"/>

</head>

<body>

<!-- Begin page -->
<div id="wrapper" style="overflow-x:hidden; position: relative">

    <!-- Topbar Start -->
    <div th:replace="~{admin_side/top-sidebar :: topSidebar}"></div>
    <!-- end Topbar -->

    <!-- Left Sidebar Start -->
    <div th:replace="~{admin_side/left-sidebar :: leftSidebar}"></div>
    <!-- End Sidebar -->

    <!-- ============================================================== -->
    <!-- Start Page Content here -->
    <!-- ============================================================== -->

    <div class="content-page">
        <div class="content">

            <!-- Start container-fluid -->
            <div class="container-fluid">

                <!-- start -->
                <div class="row">
                    <div class="col-12">
                        <div>
                            <nav aria-label="breadcrumb">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a th:href="@{#}">User Management</a></li>
                                    <li class="breadcrumb-item active" aria-current="page">User List</li>
                                </ol>
                            </nav>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="header-title">User List</h4>
                        </div>
                    </div>
                </div>

                <!-- end row -->

                <div class="row">
                    <div class="col-12">
                        <div class="row mb-3">
                            <div class="col-12">
                                <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
                                    <!-- Search -->
                                    <div class="app-search-box flex-grow-1 w-100" style="max-width: 400px;">
                                        <div class="input-group">
                                            <input type="text" class="form-control" id="userSearchField"
                                                   placeholder="Search for users ..." maxlength="400"
                                                   th:value="${searchField}" aria-label="Search" aria-describedby="search-addon" />
                                            <div class="input-group-append">
                                                <button class="btn" id="userSearchButton" type="button">
                                                    <i class="fas fa-search"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Add User button -->
                                    <div class="mt-2 mt-md-0">
                                        <a th:href="@{/admin/add-user}" class="btn btn-success">Add User</a>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div id="userListContent" class="table-container">
                            <table class="table table-bordered table-striped table-hover">
                                <thead>
                                <tr>
                                    <th>Full Name</th>
                                    <th>Email</th>
                                    <th>Phone No.</th>
                                    <th>DOB</th>
                                    <th>Address</th>
                                    <th>Role</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr class="clickable-row" th:each="account : ${listAccounts}"
                                    th:data-userid="${account.id}">
                                    <td th:text="${account.fullName}" th:title="${account.fullName}"></td>
                                    <td th:text="${account.email}" th:title="${account.email}"></td>
                                    <td th:text="${account.phone}" th:title="${account.phone}"></td>
                                    <td th:text="${account.dob}" th:title="${account.dob}"></td>
                                    <td th:text="${account.fullAddress}" th:title="${account.fullAddress}"></td>
                                    <td th:text="${account.role}" th:title="${account.role}"></td>
                                    <td>
                                        <span th:if="${account.status == 'Active'}" class="badge badge-success">Activated</span>
                                        <span th:if="${account.status != 'Active'}" class="badge badge-danger">Deactivated</span>
                                    </td>
                                    <td style="white-space: nowrap;">
                                        <a href="#" class="btn btn-sm btn-light edit-user-btn"
                                           th:data-userid="${account.id}">
                                            <i class="ti-pencil"></i>
                                        </a>
                                        <a href="#" class="btn btn-sm btn-danger delete-user-btn"
                                           th:data-userid="${account.id}">
                                            <i class="ti-trash"></i>
                                        </a>
                                    </td>
                                </tr>
                                </tbody>

                            </table>

                            <div id="noResultsMessage" th:if="${listAccounts.size() == 0}" class="alert alert-warning"
                                 role="alert">
                                <span th:text="#{ME_012}"></span>
                            </div>

                        </div>

                        <div class="row">
                            <div class="col-9"></div>
                            <div class="col-3">
                                <nav aria-label="Pagination" style="float:right" class="pagination-container">
                                    <th:block th:if="${numberPage > 1}">
                                        <ul class="pagination">

                                            <!-- Nút Previous -->
                                            <li th:classappend="${currentPage > 0} ? 'page-item' : 'page-item disabled'">
                                                <a class="page-link user-page-item" href="#"
                                                   th:data-page="${currentPage - 1}">Previous</a>
                                            </li>

                                            <!-- Trang đầu -->
                                            <li th:if="${currentPage > 2}" class="page-item">
                                                <a class="page-link user-page-item" href="#" th:data-page="0">1</a>
                                            </li>

                                            <!-- Dấu ... trước -->
                                            <li th:if="${currentPage > 3}" class="page-item disabled">
                                                <span class="page-link">...</span>
                                            </li>

                                            <!-- Các trang gần trang hiện tại -->
                                            <th:block th:each="page : ${#numbers.sequence(0, numberPage - 1)}"
                                                      th:if="${page >= currentPage - 2 and page <= currentPage + 2}">
                                                <li th:classappend="${page == currentPage} ? 'page-item active' : 'page-item'">
                                                    <a class="page-link user-page-item" href="#" th:data-page="${page}"
                                                       th:text="${page + 1}"></a>
                                                </li>
                                            </th:block>

                                            <!-- Dấu ... sau -->
                                            <li th:if="${currentPage < numberPage - 4}" class="page-item disabled">
                                                <span class="page-link">...</span>
                                            </li>

                                            <!-- Trang cuối -->
                                            <li th:if="${currentPage < numberPage - 3}" class="page-item">
                                                <a class="page-link user-page-item" href="#"
                                                   th:data-page="${numberPage - 1}"
                                                   th:text="${numberPage}"></a>
                                            </li>

                                            <!-- Nút Next -->
                                            <li th:classappend="${currentPage < numberPage - 1} ? 'page-item' : 'page-item disabled'">
                                                <a class="page-link user-page-item" href="#"
                                                   th:data-page="${currentPage + 1}">Next</a>
                                            </li>

                                        </ul>
                                    </th:block>
                                </nav>
                            </div>
                        </div>


                    </div>
                </div>
                <!-- end row -->

                <!-- Delete Confirmation Modal -->
                <div class="modal fade" id="deleteUserModal" tabindex="-1" role="dialog"
                     aria-labelledby="deleteUserModalLabel" aria-hidden="true">
                    <div class="modal-dialog" role="document">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="deleteUserModalLabel">Confirm Deletion</h5>
                                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div>
                            <div class="modal-body">
                                Are you sure you want to delete this user?
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                                <button type="button" class="btn btn-danger" id="confirmDeleteUser">Delete</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Success/Error Modal -->
                <div class="modal fade" id="deleteResultModal" tabindex="-1" role="dialog"
                     aria-labelledby="deleteResultModalLabel" aria-hidden="true">
                    <div class="modal-dialog" role="document">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="deleteResultModalLabel">Notification</h5>
                                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div>
                            <div class="modal-body" id="deleteResultMessage">
                                <!-- Message will be inserted dynamically -->
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-primary" data-dismiss="modal">OK</button>
                            </div>
                        </div>
                    </div>
                </div>


                <!-- Footer -->
                <footer class="footer">
                    <div class="container-fluid">
                        <div class="row">
                            <div class="col-md-12">2017 - 2020 &copy; Simple theme by <a href="#">Coderthemes</a></div>
                        </div>
                    </div>
                </footer>


            </div>
            <!-- end container-fluid -->

        </div>
        <!-- end content -->

    </div>
    l
    <!-- END content-page -->


</div>
<!-- END wrapper -->


<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<!-- Vendor js -->
<script src="/admin_side/js/vendor.min.js"></script>

<!-- Buttons examples -->
<script src="/admin_side/libs/jszip/jszip.min.js"></script>
<script src="/admin_side/libs/pdfmake/vfs_fonts.js"></script>
<!-- Modal js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- App js -->
<script src="/admin_side/js/app.min.js"></script>
<script src="/admin_side/js/user-list.js"></script>

</body>


</html>
