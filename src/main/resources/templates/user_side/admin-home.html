<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <title>Admin Home</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }

    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
    }

    .popup {
      background: white;
      padding: 20px;
      width: 350px;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .popup h2 {
      margin: 0;
      font-size: 20px;
    }

    .popup p {
      color: #555;
      margin: 10px 0;
    }

    .button-container {
      margin-top: 15px;
    }

    .btn {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-yes {
      background: #28a745;
      color: white;
    }

    .btn-yes:hover {
      background: #218838;
    }

    .btn-cancel {
      background: #ccc;
      margin-left: 10px;
    }

    .btn-cancel:hover {
      background: #aaa;
    }
  </style>

  <script>
    function showPopup() {
      document.getElementById("logoutPopup").style.display = "block";
    }

    function hidePopup() {
      document.getElementById("logoutPopup").style.display = "none";
    }

    function confirmLogout() {
      document.getElementById("logoutForm").submit();
    }
  </script>
</head>
<body>

<div class="logout-container">
  <h1>Welcome, Admin!</h1>
  <p>This is the admin dashboard.</p>
  <p>
    User: <span sec:authentication="principal.username"></span><br>
    Role: <span sec:authentication="principal.authorities"></span>
  </p>

  <button class="btn btn-yes" onclick="showPopup()">Logout</button>
</div>

<div id="logoutPopup" class="overlay">
  <div class="popup">
    <h2>Are you leaving?</h2>
    <p>Are you sure you want to logout? All your unsaved data will be lost.</p>
    <div class="button-container">
      <button class="btn btn-yes" onclick="confirmLogout()">Yes</button>
      <button class="btn btn-cancel" onclick="hidePopup()">Cancel</button>
    </div>
  </div>
</div>

<form id="logoutForm" th:action="@{/logout}" method="post"></form>

</body>
</html>
