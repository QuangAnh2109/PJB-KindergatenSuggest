<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Verify Account</title>
    <link rel="icon" th:href="@{/user_side/images/icon.png}" type="image/gif" sizes="16x16">
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <!-- CSS Files -->
    <link th:href="@{/user_side/css/bootstrap.min.css}" rel="stylesheet" type="text/css">
    <link th:href="@{/user_side/css/mdb.min.css}" rel="stylesheet" type="text/css">
    <link th:href="@{/user_side/css/style.css}" rel="stylesheet" type="text/css">
</head>

<body class="dark-scheme">
<div id="wrapper">
    <!-- Page Preloader -->
    <div id="de-preloader"></div>

    <!-- Content Begin -->
    <div class="no-bottom no-top" id="content">
        <div id="top"></div>
        <section id="section-verify" class="jarallax text-light pt50 pb50 vertical-center" aria-label="section">
            <img th:src="@{/user_side/images/background/background3.jpg}" style="filter: brightness(66%);" class="jarallax-img" alt="Verify Account Background">

            <div class="container">
                <div class="row align-items-center">
                    <div class="col-lg-6">
                        <h1>Verify Your Account</h1>
                        <p th:if="${message}" class="text-success" th:text="${message}"></p>
                        <p th:if="${error}" class="text-danger" th:text="${error}"></p>
                        <a th:href="@{/public/showMyLoginPage}" class="btn-main">Go to Login</a>
                        <div class="spacer-10"></div>
                    </div>
                    <div class="col-lg-6 text-center">
                        <h1 class="s2">
                            <span class="c1">Verify</span>
                            <span class="spacer-single"></span>
                            <span class="c3">Your Account</span>
                        </h1>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <!-- Content Close -->
</div>
<!-- Javascript Files -->
<script th:src="@{/user_side/js/plugins.js}"></script>
<script th:src="@{/user_side/js/designesia.js}"></script>
</body>
</html>
