<!DOCTYPE html>
<html lang="zxx" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reset Password | KinderGarten</title>
    <link rel="icon" th:href="@{/user_side/images/icon.png}" type="image/gif" sizes="16x16">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kinder Garten Pa  ssword Reset">

    <!-- CSS Files -->
    <link th:href="@{/user_side/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/mdb.min.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/plugins.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/style.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/coloring.css}" rel="stylesheet">
    <link id="colors" th:href="@{/user_side/css/colors/scheme-01.css}" rel="stylesheet">
</head>
<body>
<div id="wrapper">
    <div id="de-preloader"></div>
    <!-- Header -->
    <div th:replace="~{user_side/header :: header}"></div>
    <div class="no-bottom no-top" id="content">
        <section id="subheader" class="jarallax text-light" style="background: url('/user_side/images/background/subheader.jpg') center/cover;">
            <div class="container text-center">
                <h1 class="display-4">Reset Your Password</h1>
            </div>
        </section>

        <section class="py-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-6">
                        <div class="card shadow-lg p-4">
                            <h3 class="text-center mb-3">Forgot your password?</h3>
                            <p class="text-center text-muted">Enter your email address below to receive password reset instructions.</p>

                            <form name="resetPasswordForm" method="post" th:action="@{/public/forgot-password}">
                                <div class="form-group">
                                    <label for="email">Email Address</label>
                                    <input type="email" name="email" id="email" class="form-control" placeholder="Enter your email" required>
                                    <div th:if="${userNotExist}" th:text="${userNotExist}" class="alert alert-danger mt-2"></div>
                                    <div th:if="${emailError}" th:text="${emailError}" class="alert alert-danger mt-2"></div>
                                </div>

                                <div class="text-center mt-4">
                                    <button type="submit" class="btn btn-primary" id="submitBtn">
                                        Submit
                                    </button>
                                    <div id="loadingSpinner" class="spinner-border text-primary d-none" role="status">
                                        <span class="sr-only">Loading...</span>
                                    </div>
                                    <a href="/" class="btn btn-secondary">Cancel</a>
                                </div>

                                <div th:if="${message}" th:text="${message}" class="alert alert-success mt-3 text-center"></div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <a href="#" id="back-to-top" class="btn btn-primary rounded-circle p-3 shadow-sm" style="position: fixed; bottom: 20px; right: 20px; display: none;">&#8593;</a>
</div>

<!-- JS Files -->
<script th:src="@{/user_side/js/plugins.js}"></script>
<script th:src="@{/user_side/js/designesia.js}"></script>
<script>
    document.getElementById("contact_form").addEventListener("submit", function() {
        document.getElementById("submitBtn").disabled = true;
        document.getElementById("loadingSpinner").classList.remove("d-none");
    });

</script>
</body>
</html>
