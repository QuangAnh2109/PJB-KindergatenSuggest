<!DOCTYPE html>
<html lang="zxx" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>KinderGarten Suggestion</title>
    <link rel="icon" th:href="@{/user_side/images/icon.png}" type="image/gif" sizes="16x16">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kinder Garten Suggestion">
    <meta name="keywords" content="">
    <meta name="author" content="">
    <!-- CSS Files -->
    <link th:href="@{/user_side/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/mdb.min.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/plugins.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/style.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/coloring.css}" rel="stylesheet">
    <link id="colors" th:href="@{/user_side/css/colors/scheme-01.css}" rel="stylesheet">
</head>
<body>
<div id="wrapper">
    <div id="de-preloader"></div>

    <!-- Include header -->
    <div th:replace="~{user_side/header :: header}"></div>
    <div class="no-bottom no-top" id="content">
        <div id="top"></div>
        <section id="subheader" class="jarallax text-light">
            <img th:src="@{user_side/images/background/subheader.jpg}" class="jarallax-img" alt="">
            <div class="center-y relative text-center">
                <div class="container">
                    <div class="row">
                        <div class="col-md-12 text-center">
                            <h1>Reset Password</h1>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section aria-label="section">
            <div class="container">
                <div class="row">
                    <div class="col-md-8 offset-md-2">
                        <h3>Forgot your password? Reset it now.</h3>
                        <p>Enter your email address below and we'll send you instructions on how to reset your password.</p>
                        <div class="spacer-10"></div>

                        <form name="contactForm" id='contact_form' class="form-border" method="post" th:action="@{/forgot-password}">
                            <div class="row">
                                <div class="col-md-12">
                                    <div class="field-set">
                                        <label>Email Address:</label>
                                        <input type='text' name='email' id='email' class="form-control" placeholder="Enter your email">
<!--                                        <div th:if="${userNotExist}" th:text="${userNotExist}" class="alert-danger danger">-->
<!--                                        </div>-->
<!--                                        <div th:if="${emailError}" th:text="${userNotExist}" class="alert-danger danger">-->
<!--                                        </div>-->
                                    </div>
                                </div>

                                <div class="col-md-12">
                                    <div class="col-md-4 mb60">
                                        <div class="spacer10"></div>
                                        <button type="submit" class="btn-main">Submit</button>
                                        <button type="button" class="btn-main">Cancel</button>
                                        <span th:if="${message}" th:text="${message}" class="alert-success"></span>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <a href="#" id="back-to-top"></a>

    <!-- Include footer -->
</div>

<script th:src="@{/user_side/js/plugins.js}"></script>
<script th:src="@{/user_side/js/designesia.js}"></script>
</body>
</html>
