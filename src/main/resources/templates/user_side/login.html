<!DOCTYPE html>
<html lang="zxx" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>KinderGarten Suggestion</title>
    <link rel="icon" th:href="@{/user_side/images/icon.png}" type="image/gif" sizes="16x16">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kinder Garten Suggestion">
    <meta name="keywords" content="">
    <meta name="author" content="">

    <!-- CSS Files -->
    <link th:href="@{/user_side/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/mdb.min.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/plugins.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/style.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/coloring.css}" rel="stylesheet">
    <link id="colors" th:href="@{/user_side/css/colors/scheme-01.css}" rel="stylesheet">
</head>
<body>
<div id="wrapper">
    <div class="no-bottom no-top" id="content">
        <div id="top"></div>
        <section id="section-hero" aria-label="section" class="jarallax">
            <img th:src="@{/user_side/images/background/2.jpg}" class="jarallax-img" alt="">
            <div class="v-center">
                <div class="container">
                    <div class="row align-items-center">
                        <div class="col-lg-4 offset-lg-4">
                            <div class="padding40 rounded-3 shadow-soft" data-bgcolor="#ffffff">
                                <h4 class="text-center">Login into your account</h4>
                                <div class="spacer-10"></div>

                                <div th:if="${param.error}" class="alert alert-danger text-center"
                                     th:text="'Invalid email or password. Please try again.'"></div>
                                <!--                                <div th:if="${emailError}" class="alert alert-warning text-center" th:text="${emailError}"></div>-->
<!--                                <div th:if="${missingError}" class="alert alert-warning text-center" th:text="${missingError}"></div>-->
                                <form action="#" th:action="@{/authenticateTheUser}" method="post">
                                    <div class="field-set">
                                        <label>Email address</label>
                                        <div class="input-group">
                                            <input type="text" name="username" id="username" class="form-control"
                                                   placeholder="Enter your email"  />
                                            <span class="input-group-text"><i class="fa fa-envelope"></i></span>
                                        </div>
                                    </div>

                                    <div class="field-set mt-3">
                                        <label>Password</label>
                                        <div class="input-group">
                                            <input type="password" name="password" id="password" class="form-control"
                                                   placeholder="Enter your password"  />
                                            <span class="input-group-text"><i class="fa fa-lock"></i></span>
                                        </div>
                                    </div>

                                    <div class="text-center mt-3">
                                        <a th:href="@{/forgot-password}">Forgot password?</a>
                                    </div>

                                    <div class="text-center mt-4">
                                        <button type="submit" class="btn btn-primary btn-block">Login now</button>
                                    </div>

                                    <div class="text-center mt-3">OR</div>

                                    <div class="text-center mt-3">
                                        <a th:href="@{/register}" class="btn btn-outline-primary btn-block">Signup now</a>
                                    </div>
                                </form>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>

<!-- Javascript Files -->
<script th:src="@{/user_side/js/plugins.js}"></script>
<script th:src="@{/user_side/js/designesia.js}"></script>

</body>
</html>
