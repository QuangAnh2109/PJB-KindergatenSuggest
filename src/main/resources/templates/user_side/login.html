<!DOCTYPE html>
<html lang="zxx" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>KinderGarten Suggestion</title>
    <link rel="icon" th:href="@{/user_side/images/icon.png}" type="image/gif" sizes="16x16">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kinder Garten Suggestion">
    <meta name="keywords" content="">
    <meta name="author" content="">

    <!-- CSS Files -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/user_side/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/mdb.min.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/plugins.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/style.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/coloring.css}" rel="stylesheet">
    <link id="colors" th:href="@{/user_side/css/colors/scheme-01.css}" rel="stylesheet">
</head>
<body>
<div id="wrapper">
    <div id="de-preloader"></div>
    <div class="no-bottom no-top" id="content">
        <div id="top"></div>
        <div th:insert="~{user_side/header :: header}"></div>
        <section id="section-hero" aria-label="section" class="jarallax">
            <img th:src="@{/user_side/images/background/background3.jpg}" class="jarallax-img" alt="">
            <div class="v-center">
                <div class="container">
                    <div class="row align-items-center">
                        <div class="col-lg-4 offset-lg-4">
                            <div class="padding40 rounded-3 shadow-soft" data-bgcolor="#ffffff">
                                <h4 class="text-center">Login into your account</h4>
                                <div class="spacer-10"></div>

                                <div th:if="${error}" class="alert alert-danger text-center">
                                    <span th:text="${error}"></span>

                                </div>
                                <div th:if="${message}"  th:hidden="true" class="alert alert-success text-center" id="logoutMessage">
                                    <span th:text="${message}" ></span>

                                </div>
                                <form action="#" th:action="@{/authenticateTheUser}" method="post" name="loginForm">
                                    <div class="field-set">
                                        <label>Email address</label>
                                        <div class="input-group">
                                            <input type="text" th:name="username" id="username" class="form-control"
                                                   placeholder="Enter your email" th:value="${email}"/>
                                            <span class="input-group-text"><i class="fa fa-envelope"></i></span>
                                        </div>
                                        <div></div>
                                    </div>

                                    <div class="field-set mt-3">
                                        <label>Password</label>
                                        <div class="input-group">
                                            <input type="password" th:name="password" id="password" class="form-control"
                                                   placeholder="Enter your password"/>
                                            <span class="input-group-text" onclick="togglePassword()"
                                                  style="cursor: pointer;">
        <i class="fa fa-eye" id="toggleIcon"></i>
    </span>
                                        </div>
                                        <div></div>
                                    </div>

                                    <div class="text-center mt-3">
                                        <a th:href="@{/public/forgot-password}">Forgot password?</a>
                                    </div>

                                    <div class="text-center mt-4">
                                        <button type="submit" id="loginBtn" class="btn btn-success btn-block">Login
                                        </button>
                                    </div>
                                    <div class="text-center mt-3">OR</div>

                                </form>
                                <div class="text-center mt-3">
                                    <button style="background-color: #0e52c1; color: white;" class="btn btn-block"
                                            th:onclick="|window.location.href='@{/public/register}'|">Sign Up
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<!-- Modal Xác nhận -->
<!-- Javascript Files -->
<script th:src="@{/user_side/js/dropdown.js}"></script>
<script th:src="@{/user_side/js/plugins.js}"></script>
<script th:src="@{/user_side/js/designesia.js}"></script>
<script th:src="@{/user_side/js/login.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/user_side/js/validate.js}"></script>

<script>
    function togglePassword() {
        var passwordInput = document.getElementById("password");
        var toggleIcon = document.getElementById("toggleIcon");

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleIcon.classList.remove("fa-eye");
            toggleIcon.classList.add("fa-eye-slash");
        } else {
            passwordInput.type = "password";
            toggleIcon.classList.remove("fa-eye-slash");
            toggleIcon.classList.add("fa-eye");
        }
    }
</script>
<script>
    window.onload = function () {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('timeout') === 'true' && !sessionStorage.getItem("sessionTimeoutAlerted")) {
            alert("Session has expired. Please log in again.");
            sessionStorage.setItem("sessionTimeoutAlerted", "true");
            window.history.replaceState({}, document.title, window.location.pathname);
        }
        let logoutMessage = document.getElementById("logoutMessage");
        if (logoutMessage) {
            {
                Swal.fire({
                    title: "Success",
                    text: logoutMessage.textContent,
                    icon: "success",
                    confirmButtonText: "OK"
                })
            }
        }
    };
</script>
<script th:inline="javascript">
    var messages = {
        requiredField: /*[[#{ME_003}]]*/ "This field is required",
        invalidEmail: /*[[#{ME_028}]]*/ "Please enter a valid email address",
        passwordLength: /*[[#{ME_043}]]*/ "Password length must be between 12 and 72 characters",
        errorOccur: /*[[#{ ME_017}]]*/ "An unexpected error occurred. Please try again later."
    };
</script>
</body>
</html>
