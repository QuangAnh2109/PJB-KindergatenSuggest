
<!DOCTYPE html>
<html lang="zxx" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>KinderGarten Suggestion</title>
    <link rel="icon" th:href="@{/user_side/images/icon.png}" type="image/gif" sizes="16x16">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kinder Garten Suggestion">
    <meta name="keywords" content="">
    <meta name="author" content="">

    <!-- CSS Files -->
    <link th:href="@{/user_side/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/mdb.min.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/plugins.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/style.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/coloring.css}" rel="stylesheet">
    <link id="colors" th:href="@{/user_side/css/colors/scheme-01.css}" rel="stylesheet">
    <style>
        .modal.fade .modal-dialog {
            transform: translateY(-20px);
            opacity: 0;
            transition: all 0.3s ease-in-out;
        }

        .modal.show .modal-dialog {
            transform: translateY(0);
            opacity: 1;
        }

        .modal-content {
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
        }

        .success-icon i {
            animation: popIn 0.5s ease-out;
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            80% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        #redirectLogin {
            border-radius: 8px;
            transition: all 0.3s ease-in-out;
        }
        #redirectLogin:hover {
            background-color: #28a745;
            transform: translateY(-2px);
            box-shadow: 0px 5px 15px rgba(40, 167, 69, 0.4);
        }
    </style>
</head>
<body>
<div id="wrapper">

    <!-- page preloader begin -->
    <div id="de-preloader"></div>
    <!-- page preloader close -->

    <!-- header begin --><!-- header close -->

    <!-- content begin -->
    <div class="no-bottom no-top" id="content">
        <div id="top"></div>
        <!-- section begin -->
        <section id="subheader" class="jarallax text-light" style="background: url('/user_side/images/background/subheader.jpg') center/cover;">
            <div class="container text-center">
                <h1 class="display-4">Reset Password</h1>
            </div>
        </section>
        <!-- section close -->
        <section aria-label="section">
            <div class="container">
                <div class="row">
                    <div class="col-md-8 padding offset-md-2">
                        <h3>Forgot your password? Reset it now.</h3>
                        <p>Please reset your new password</p>
                        <div th:if="${error}" class="alert alert-danger">
                            <span th:text="${error}"></span>
                        </div>
                        <div th:if="${passwordReset}" id="success-message" class="alert-success"  aria-hidden="true">
                        </div>
                        <div class="spacer-10"></div>
                        <form name="contactForm" id='contact_form' class="form-border" th:action="@{/public/reset-password}" method="post">
                            <input type="hidden" name="token" th:value="${token}" />
                            <div class="row">
                                <div class="col-md-12">
                                    <div class="field-set">
                                        <label>Password:</label>
                                        <input type="password" th:name="newPassword" id="password" class="form-control" placeholder="Enter new password" >
                                        <div th:if="${newPasswordError}" th:text="${newPasswordError}" class="text-danger"></div>
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <div class="field-set">
                                        <label>Confirm Password:</label>
                                        <input type="password" th:name="confirmPassword" id="re-password" class="form-control" placeholder="Confirm new password" >
                                        <div th:if="${confirmPasswordError}" th:text="${confirmPasswordError}" class="text-danger"></div>

                                    </div>
                                </div>
                                <div th:if="${passwordReset}" th:text="${passwordReset}" class="success">
                                </div>
                                <div class="col-md-12 d-flex justify-content-center">
                                    <div class="col-md-4 mb60 d-flex gap-4 justify-content-center">
                                        <a href="/public/showMyLoginPage"  class="btn-main">Cancel</a>
                                        <input type="submit" value="Reset" id="reset-button" class="btn-main">
                                    </div>
                                </div>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </section>
    </div>
    <!-- content close -->
</div>
<div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg rounded-4 border-0 overflow-hidden">
            <!-- Nội dung modal -->
            <div class="modal-body text-center p-5">
                <div class="d-flex justify-content-center mb-3">
                    <div class="success-icon">
                        <i class="bi bi-check-circle-fill text-success fs-1"></i>
                    </div>
                </div>
                <h4 class="fw-bold text-success">Password Reset Successfully!</h4>
                <p class="text-muted mb-4">You can now log in using your new password.</p>
            </div>

            <!-- Nút bấm -->
            <div class="modal-footer d-flex justify-content-center border-0 pb-4">
                <button type="button" class="btn btn-lg btn-success px-5 py-2 fw-bold shadow-sm" id="redirectLogin">Login Now</button>
            </div>
        </div>
    </div>
</div>

<!-- Javascript Files -->
<script th:src="@{/user_side/js/plugins.js}"></script>
<script th:src="@{/user_side/js/designesia.js}"></script>
<script th:src="@{/user_side/js/reset-password.js}"></script>
</body>
</html>
