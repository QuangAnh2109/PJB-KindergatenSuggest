
<!DOCTYPE html>
<html lang="zxx" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>KinderGarten Suggestion</title>
    <link rel="icon" th:href="@{/user_side/images/icon.png}" type="image/gif" sizes="16x16">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kinder Garten Suggestion">
    <meta name="keywords" content="">
    <meta name="author" content="">

    <!-- CSS Files -->
    <link th:href="@{/user_side/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/mdb.min.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/plugins.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/style.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/coloring.css}" rel="stylesheet">
    <link id="colors" th:href="@{/user_side/css/colors/scheme-01.css}" rel="stylesheet">
    <style>
        .modal.fade .modal-dialog {
            transform: translateY(-20px);
            opacity: 0;
            transition: all 0.3s ease-in-out;
        }

        .modal.show .modal-dialog {
            transform: translateY(0);
            opacity: 1;
        }

        .modal-content {
            border-radius: 15px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
        }
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 42px;
            cursor: pointer;
            font-size: 18px;
            color: #888;
        }
        .toggle-password:hover {
            color: #000;
        }


        .success-icon i {
            animation: popIn 0.5s ease-out;
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            80% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        #redirectLogin {
            border-radius: 8px;
            transition: all 0.3s ease-in-out;
        }
        #redirectLogin:hover {
            background-color: #28a745;
            transform: translateY(-2px);
            box-shadow: 0px 5px 15px rgba(40, 167, 69, 0.4);
        }
    </style>
</head>
<body>
<div id="wrapper">

    <!-- page preloader begin -->
    <div id="de-preloader"></div>
    <!-- page preloader close -->

    <!-- header begin --><!-- header close -->

    <!-- content begin -->
    <div class="no-bottom no-top" id="content">
        <div id="top"></div>
        <!-- section begin -->
        <section id="subheader" class="jarallax text-light" style="background: url('/user_side/images/background/subheader.jpg') center/cover;">
            <div class="container text-center">
                <h1 class="display-4">Reset Password</h1>
            </div>
        </section>
        <!-- section close -->
        <section aria-label="section">
            <div class="container">
                <div class="row">
                    <div class="col-md-8 padding offset-md-2">
                        <h3>Forgot your password? Reset it now.</h3>
                        <p>Please reset your new password</p>
                        <div th:if="${tokenError}" class="alert alert-danger">
                            <span th:text="${tokenError}"></span>
                        </div>
                        <div th:if="${passwordResetSuccess}" id="success-message" class="alert-success"  aria-hidden="true">
                        </div>
                        <div class="spacer-10"></div>
                        <form name="contactForm" id='contact_form' class="form-border" th:action="@{/public/reset-password}" method="post">
                            <input type="hidden" name="token" th:value="${token}" />
                            <div class="row">
                                <!-- Password -->
                                <div class="col-md-12">
                                    <div class="field-set position-relative">
                                        <label>Password:</label>
                                        <input type="password" th:name="newPassword" id="password" class="form-control pr-5" placeholder="Enter new password">
                                        <i class="fa fa-eye toggle-password" toggle="#password"></i>
                                        <div th:if="${newPasswordError}" th:text="${newPasswordError}" class="text-danger"></div>
                                    </div>
                                </div>

                                <!-- Confirm Password -->
                                <div class="col-md-12">
                                    <div class="field-set position-relative">
                                        <label>Confirm Password:</label>
                                        <input type="password" th:name="confirmPassword" id="re-password" class="form-control pr-5" placeholder="Confirm new password">
                                        <i class="fa fa-eye toggle-password" toggle="#re-password"></i>
                                        <div th:if="${confirmPasswordError}" th:text="${confirmPasswordError}" class="text-danger"></div>
                                    </div>
                                </div>

                                </div>
                                <div th:if="${passwordResetSuccess}" th:text="${passwordResetSuccess}" class="success">
                                </div>
                                <div class="col-md-12 d-flex justify-content-center">
                                    <div class="col-md-4 mb60 d-flex gap-4 justify-content-center">
                                        <a href="/public/sign-in"  class="btn-main">Cancel</a>
                                        <input type="submit" value="Reset" id="reset-button" class="btn-main">
                                    </div>
                                </div>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </section>
    </div>
    <!-- content close -->
</div>


<!-- Javascript Files -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script>
    document.querySelectorAll('.toggle-password').forEach(function (toggle) {
        toggle.addEventListener('click', function () {
            const input = document.querySelector(this.getAttribute('toggle'));
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);

            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    });
</script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script th:src="@{/user_side/js/plugins.js}"></script>
<script th:src="@{/user_side/js/designesia.js}"></script>
<script th:src="@{/user_side/js/reset-password.js}"></script>
<script th:inline="javascript">
    var errorMessage = /*[[#{ME_017}]]*/ "An error has occurred. Please try again.";
</script>
</body>
</html>
