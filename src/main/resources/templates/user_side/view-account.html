<!DOCTYPE html>
<html lang="zxx" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KinderGarten Suggestion</title>
    <link rel="icon" th:href="@{/user_side/images/icon.png}" type="image/gif" sizes="16x16">
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="KinderGarten Suggestion" name="description">
    <meta content="" name="keywords">
    <meta content="" name="author">
    <!-- CSS Files
    ================================================== -->
    <link th:href="@{/user_side/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/mdb.min.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/plugins.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/style.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/coloring.css}" rel="stylesheet">
    <link id="colors" th:href="@{/user_side/css/colors/scheme-01.css}" rel="stylesheet">
</head>
<style>
    .required-label::after {
        content: " *";
        color: red;
        font-weight: bold;
    }

    .btn-primary {
        background-color: green !important;
        border-color: green !important;
    }

    .nav-pills .nav-link.active {
        background-color: #4CAF50;
        color: white;
    }

    .nav-pills .nav-link {
        color: #333;
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 5px;
        margin-right: 10px;
    }

    .tab-pane {
        padding: 20px 0;
    }

    .card {
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .toggle-password {
        position: absolute;
        right: 15px;
        top: 43px;
        cursor: pointer;
        font-size: 18px;
        color: #888;
    }
    .toggle-password:hover {
        color: #000;
    }

    .show-modal {
        display: flex !important;
        align-items: center;
        justify-content: center;
    }
</style>
<body>
<div id="wrapper">

    <!-- page preloader begin -->
    <div id="de-preloader"></div>
    <!-- page preloader close -->
    <!-- header begin -->
    <div th:if="${accountInfo.getDatetimeChangePass()!=null}">
        <div th:insert="~{user_side/header :: header}"></div>
    </div>
    <div class="no-bottom no-top zebra" id="content">
        <div id="top"></div>
        <!-- section begin -->
        <section id="subheader" class="jarallax text-light">
            <img th:src="@{/user_side/images/background/14.jpg}" class="jarallax-img" alt="">
            <div class="center-y relative text-center">
                <div class="container">
                    <div class="row">
                        <div class="col-md-12 text-center">
                            <h1>My Profile</h1>
                        </div>
                        <div class="clearfix"></div>
                    </div>
                </div>
            </div>
        </section>
        <span id="successMessage" th:text="#{ME_021}" hidden></span>

        <!-- section close -->
        <section id="section-settings" class="bg-gray-100">
            <div class="container">
                <div class="row d-flex justify-content-center">
                    <div class="col-lg-10">
                        <div class="card padding40 rounded-5 position-relative">
                            <!-- Navigation tabs -->
                            <ul class="nav nav-pills mb-4" id="accountTabs" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link active"
                                            th:classappend="${accountInfo.getDatetimeChangePass() == null} ? 'disabled' : ''"
                                            id="profile-tab" data-bs-toggle="pill"
                                            data-bs-target="#profile" type="button" role="tab" aria-controls="profile"
                                            aria-selected="true" th:disabled="${accountInfo.getDatetimeChangePass() == null}">
                                        Profile Information
                                    </button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="password-tab" data-bs-toggle="pill"
                                            data-bs-target="#password" type="button" role="tab" aria-controls="password"
                                            aria-selected="false">Change Password
                                    </button>
                                </li>
                            </ul>

                            <!-- Tab content -->
                            <div class="tab-content" id="accountTabsContent">
                                <!-- Profile Information Tab -->
                                <div class="tab-pane fade show active" id="profile" role="tabpanel"
                                     aria-labelledby="profile-tab">
                                    <div class="row update-account">
                                            <form action="#" th:action="@{/auth/view-account}" name="update-form"
                                                  method="post" th:object="${accountInfo}">
                                                <div th:if="${recordError}" id="recordErrorAlert" class="alert alert-danger" th:hidden="true">
                                                    <span th:text="${recordError}"></span>
                                                </div>
                                                <input type="hidden" th:field="*{email}">
                                                <input class="recordNo" name="recordNo" id="recordNo" th:field="*{recordNo}" th:type="hidden">

                                                <div class="mb-3">
                                                    <label class="form-label required-label">Full Name </label>
                                                    <input type="text" class="form-control" th:field="*{fullName}">
                                                    <div th:if="${fullNameError}" class="text-danger">
                                                        <span th:text="${fullNameError}"></span>
                                                    </div>
                                                </div>

                                                <div class="mb-3">
                                                    <label class="form-label required-label">Email Address </label>
                                                    <input type="email" class="form-control" th:field="*{email}" disabled>
                                                </div>

                                                <div class="mb-3">
                                                    <label class="form-label">D.O.B</label>
                                                    <input type="date" class="form-control" th:field="*{dob}"/>
                                                    <div th:if="${dobError}" class="text-danger">
                                                        <span th:text="${dobError}"></span>
                                                    </div>
                                                </div>

                                                <div class="mb-3">
                                                    <label class="form-label required-label">Mobile No. </label>
                                                    <input type="text" class="form-control" th:field="*{phone}">
                                                    <div th:if="${phoneError}" class="text-danger">
                                                        <span th:text="${phoneError}"></span>
                                                    </div>
                                                </div>

                                                <h5>Address</h5>
                                                <div class="mb-3">
                                                    <select onchange="loadDistrict(this.value)" name="city"
                                                            class="form-control">
                                                        <option th:text="${accountInfo != null and accountInfo.city != null ? accountInfo.city.cityName : ''}"
                                                                disabled selected>Province/City
                                                        </option>
                                                        <option th:each="city : ${cities}" th:value="${city.id}"
                                                                th:text="${city.cityName}"></option>
                                                    </select>
                                                    <div class="mb-3">
                                                        <select onchange="loadWard(this.value)" name="district"
                                                                id="district"
                                                                class="form-control" required disabled>
                                                            <option value="" disabled selected
                                                                    th:text="${accountInfo.district != null ? accountInfo.district.districtName : 'District'}"></option>
                                                        </select>
                                                    </div>
                                                    <div class="mb-3">
                                                        <select onchange="enableParam('address')" name="ward" id="ward"
                                                                class="form-control"
                                                                required disabled>
                                                            <option value="" disabled selected
                                                                    th:text="${accountInfo.ward != null ? accountInfo.ward.wardName : 'Ward'}"></option>
                                                        </select>
                                                    </div>
                                                    <div class="mb-3">
                                                        <input type="text" name="address" id="address" class="form-control"
                                                               th:value="${accountInfo.address != null ? accountInfo.address : ''}"
                                                               placeholder="Enter you address..."  required
                                                               disabled>
                                                        <div th:if="${fullAddressError}" class="text-danger">
                                                            <span th:text="${fullAddressError}"></span>
                                                        </div>
                                                    </div>
                                                    <div th:if="${param.success}" class="alert alert-success" th:hidden="true">
                                                    </div>

                                                    <div class="text-center">
                                                        <button type="reset" class="btn btn-primary">Cancel</button>
                                                        <button type="submit" id="updateButton" class="btn btn-primary">
                                                            Update
                                                        </button>
                                                    </div>
                                                </div>
                                            </form>
                                    </div>
                                </div>
                                <!-- Change Password Tab -->
                                <div class="tab-pane fade" id="password" role="tabpanel" aria-labelledby="password-tab">
                                    <div class="row">
                                        <form name="changePass" class="form-border" method="post"
                                              th:action="@{/auth/change-password}">
                                            <div class="de_tab tab_simple">
                                                <div class="de_tab_content">
                                                    <div class="tab-1">
                                                        <div class="row">
                                                            <div class="col-lg-12 mb-3 position-relative">
                                                                <h5>Current Password</h5>
                                                                <input type="password" name="oldPassword" id="oldPassword"
                                                                       class="form-control pr-5"
                                                                       placeholder="Enter your current password:"/>
                                                                <i class="fa fa-eye toggle-password" toggle="#oldPassword"></i>
                                                                <div th:if="${passwordError}" class="text-danger mt-2">
                                                                    <p th:text="${passwordError}"></p>
                                                                </div>
                                                            </div>

                                                            <div class="col-lg-12 mb-3 position-relative">
                                                                <h5>New Password</h5>
                                                                <input type="password" name="newPassword" id="newPassword"
                                                                       class="form-control pr-5"
                                                                       placeholder="Enter new password:"/>
                                                                <i class="fa fa-eye toggle-password" toggle="#newPassword"></i>
                                                                <div th:if="${newPasswordError}" class="text-danger mt-2">
                                                                    <p th:text="${newPasswordError}"></p>
                                                                </div>
                                                            </div>

                                                            <div class="col-lg-12 mb-3 position-relative">
                                                                <h5>Confirm Password</h5>
                                                                <input type="password" name="confirmPassword" id="confirmPassword"
                                                                       class="form-control pr-5"
                                                                       placeholder="Confirm password:"/>
                                                                <i class="fa fa-eye toggle-password" toggle="#confirmPassword"></i>
                                                                <div th:if="${confirmPasswordError}" class="text-danger mt-2">
                                                                    <p th:text="${confirmPasswordError}"></p>
                                                                </div>
                                                            </div>

                                                            <div th:if="${successUpdate}"
                                                                 class="alert alert-success success3" th:hidden="true">
                                                            </div>
                                                            <div th:if="${exceptionError}" class="text-danger mt-3">
                                                                <p th:text="${exceptionError}"></p>
                                                            </div>
                                                            <div class="col-md-12 d-flex justify-content-center mt-4">
                                                                <div class="col-md-4 mb60 d-flex gap-4 justify-content-center"
                                                                     id="actionButtons">
                                                                    <div id="normalButtons">
                                                                        <input type="reset" value="Cancel"
                                                                               class="btn-main">
                                                                        <input type="submit" id="submitButton"
                                                                               value="Save" class="btn-main">
                                                                    </div>
                                                                    <div th:if="${successUpdate}" id="loginButton">
                                                                        <a th:href="@{/public/sign-in}"
                                                                           class="btn-main">Back to Login</a>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<!-- Javascript Files
================================================== -->
<script th:src="@{/user_side/js/plugins.js}"></script>
<script th:src="@{/user_side/js/designesia.js}"></script>
<script th:src="@{/user_side/js/account-management.js}"></script>
<script th:src="@{/user_side/js/dropdown.js}"></script>
<script th:src="@{/user_side/js/address-load.js}"></script>
<!-- Bootstrap 5 JS for Tab functionality -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script>
    function initializeTogglePassword() {
        document.querySelectorAll('.toggle-password').forEach(function (icon) {
            icon.removeEventListener('click', togglePasswordHandler); // tránh duplicate event
            icon.addEventListener('click', togglePasswordHandler);
        });
    }

    function togglePasswordHandler() {
        const input = document.querySelector(this.getAttribute('toggle'));
        const isPassword = input.getAttribute('type') === 'password';
        input.setAttribute('type', isPassword ? 'text' : 'password');
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
    }

    // Gọi khi trang load
    document.addEventListener('DOMContentLoaded', initializeTogglePassword);
</script>


<script>
    window.addEventListener('click', function (event) {
        if (!event.target.matches('.dropdown-toggle') && !event.target.closest('.dropdown-menu')) {
            var dropdowns = document.getElementsByClassName("dropdown-menu");
            for (var i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                if (openDropdown.classList.contains('show')) {
                    openDropdown.classList.remove('show');
                }
            }
        }
    });
    document.addEventListener('DOMContentLoaded', function () {
        // Check if there's a tab parameter in the URL
        const urlParams = new URLSearchParams(window.location.search);
        const tabParam = urlParams.get('tab');

        if (tabParam === 'password') {
            document.getElementById('password-tab').click();
        }

        // Check if there's an activeTab attribute in the model
        const activeTabElement = document.querySelector('[data-active-tab]');
        if (activeTabElement && activeTabElement.dataset.activeTab === 'password') {
            document.getElementById('password-tab').click();
        }

        // Show success modal and redirect for password change
        document.addEventListener('DOMContentLoaded', function () {
            const urlParams = new URLSearchParams(window.location.search);
            const successParam = urlParams.get('success');
            const passwordTab = document.getElementById('password-tab');
            const profileTab = document.getElementById('profile-tab');

            // Check if there's a password success message
            if (document.getElementById('successUpdate') || document.getElementById('passwordError')) {
                passwordTab.click();
            }
            // Add click event listener to redirect login button
            const redirectLoginBtn = document.getElementById('redirectLogin');
            if (redirectLoginBtn) {
                redirectLoginBtn.addEventListener('click', function () {
                    window.location.href = '/public/sign-in';
                });
            }
        })
    })
</script>

<script>
    // Simple implementation if Bootstrap JS is not fully loaded
    document.addEventListener('DOMContentLoaded', function () {
        const tabs = document.querySelectorAll('[data-bs-toggle="pill"]');

        tabs.forEach(tab => {
            tab.addEventListener('click', function (e) {
                e.preventDefault();

                // Remove active class from all tabs and panes
                document.querySelectorAll('.nav-link').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-pane').forEach(p => {
                    p.classList.remove('show');
                    p.classList.remove('active');
                });

                // Add active class to clicked tab
                this.classList.add('active');

                // Get target pane ID and activate it
                const targetId = this.getAttribute('data-bs-target').substring(1);
                const targetPane = document.getElementById(targetId);
                targetPane.classList.add('show');
                targetPane.classList.add('active');
            });
        });
    });
</script>
<script th:inline="javascript">
    var message =
    {
         updateSuccess :/*[[#{ME_074}]]*/ "Update Successfully!",
         loginBackMessage :/*[[#{ME_015}]]*/ "You can now log in using your new password.",
         errorMessage : /*[[#{ME_017}]]*/ "An error has occurred. Please try again.",
        dontChange : /*[[#{ME_053}]]*/ "You don't change anything."
    }
</script>
</body>
</html>
