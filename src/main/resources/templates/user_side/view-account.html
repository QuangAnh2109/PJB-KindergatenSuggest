<!DOCTYPE html>
<html lang="en">
<head>
    <title>User Profile</title>
    <meta charset="UTF-8">
    <link rel="icon" th:href="@{/user_side/images/icon.png}" type="image/gif" sizes="16x16">
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Rentaly - Multipurpose Vehicle Car Rental Website Template" name="description">
    <link th:href="@{/user_side/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/mdb.min.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/plugins.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/style.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/coloring.css}" rel="stylesheet">
    <link id="colors" th:href="@{/user_side/css/colors/scheme-01.css}" rel="stylesheet">
    <style>
        .required-label::after {
            content: " *";
            color: red;
            font-weight: bold;
        }
        .btn-primary { background-color: green !important; border-color: green !important; }
    </style>
</head>
<body>
<div id="de-preloader"></div>
<section id="subheader" class="jarallax text-light">
    <img th:src="@{user_side/images/background/subheader.jpg}" class="jarallax-img" alt="">
    <div class="center-y relative text-center">
        <div class="container">
            <div class="row">
                <div class="col-md-12 text-center">
                    <h1>My Profile</h1>
                </div>
            </div>
        </div>
    </div>
</section>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow p-4 rounded-5">
                <h3 class="text-center mb-4">User Profile</h3>
                <form>
                    <div class="mb-3">
                        <label class="form-label required-label">Full Name </label>
                        <input type="text" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label required-label">Email Address </label>
                        <input type="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">D.O.B</label>
                        <input type="date" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label required-label">Mobile No. </label>
                        <input type="text" class="form-control" required>
                    </div>
                    <h5>Address</h5>
                    <div class="mb-3">
                        <select class="form-select" required>
                            <option selected>City/Province</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <select class="form-select" required>
                            <option selected>District</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <select class="form-select" required>
                            <option selected>Ward</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="House Number, Street" required>
                    </div>
                    <div class="text-center">
                        <button type="button" class="btn btn-primary">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/user_side/js/plugins.js}"></script>
<script th:src="@{/user_side/js/designesia.js}"></script>
</body>
</html>
