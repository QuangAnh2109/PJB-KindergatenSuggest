<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <link th:href="@{/user_side/css/style.css}" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Add FontAwesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/user_side/css/plugins.css}" rel="stylesheet" type="text/css">
    <link th:href="@{/user_side/css/coloring.css}" rel="stylesheet" type="text/css">

    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .overlay {
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            z-index: 9999;
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
        }

        .overlay.active {
            opacity: 1 !important;
            visibility: visible !important;
        }

        .popup {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            width: 300px;
        }

        .button-container {
            margin-top: 15px;
        }

        .btn-yes {
            background-color: #d9534f;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
        }

        .btn-cancel {
            background-color: #5bc0de;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
        }

        /* Improved Dropdown Styles */
        .logout-container {
            position: relative;
            display: inline-block;
            z-index: 1000;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-toggle {
            background-color: #1ECB15;
            color: white;
            padding: 8px 16px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .arrow-down {
            display: inline-block;
            margin-left: 8px;
            border: solid #212529;
            border-width: 0 2px 2px 0;
            padding: 3px;
            transform: rotate(45deg);
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            background-color: #fff;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1001;
            border-radius: 4px;
            margin-top: 2px;
        }

        .dropdown-menu a {
            color: #212529;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-menu a:hover {
            background-color: #f8f9fa;
        }

        .dropdown-divider {
            height: 1px;
            background-color: #e9ecef;
            margin: 0;
        }

        .show {
            display: block !important;
        }
    </style>
</head>
<body>
<!-- header begin -->
<header class="transparent scroll-light has-topbar">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="de-flex sm-pt10">
                    <div class="de-flex-col">
                        <div class="de-flex-col">
                            <!-- logo begin -->
                            <div id="logo">
                                <a th:href="@{/public/home}">
                                    <img class="logo-1" src="/user_side/images/logo-light.png" alt="">
                                    <img class="logo-2" src="/user_side/images/logo1.png" alt="">
                                </a>
                            </div>
                            <!-- logo close -->
                        </div>
                    </div>
                    <div class="de-flex-col header-col-mid">
                        <ul id="mainmenu">
                            <li><a class="menu-item" href="/public/school/search">School Search</a>
                            </li>
                            <li><a class="menu-item" href="#">Community</a>
                            </li>
                            <li><a class="menu-item" href="#">About Us</a>
                            </li>
                        </ul>
                    </div>
                    <div class="de-flex-col">
                        <div class="menu_side_area" sec:authorize="!isAuthenticated()">
                            <a th:href="@{/showMyLoginPage}" class="btn-main">Login</a>
                            <span class="menu-btn"></span>
                        </div>
                        <div class="menu_side_area" sec:authorize="!isAuthenticated()">
                            <a th:href="@{/register}" class="btn-main">Sign Up</a>
                            <span class="menu-btn"></span>
                        </div>
                        <div class="logout-container" sec:authorize="isAuthenticated()">
                            <div class="dropdown">
                                <button class="dropdown-toggle" id="userDropdown">
                                    <span><i class="fa fa-user-o" aria-hidden="true" style="margin-right: 5px"></i></span>
                                    Welcome, <span th:text="${session.nameAccount}"></span>
                                    <i class="arrow-down"></i>
                                </button>
                                <div class="dropdown-menu dropdown-menu-right" id="featuresDropdown">
                                    <a href="/parent/my-school"><span><i class="fa-solid fa-school"></i></span> My
                                        School</a>
                                    <div class="dropdown-divider"></div>
                                    <a href="/parent/my-request"><span><i class="fas fa-clipboard-list"></i></span>
                                        My
                                        Request</a>
                                    <div class="dropdown-divider"></div>
                                    <a href="/auth/view-account"><span><i class="fa-solid fa-user"></i></span> My
                                        Profile</a>
                                    <div class="dropdown-divider"></div>
                                    <a href="#" id="logoutButton"><span><i
                                            class="fa-solid fa-right-from-bracket"></i></span> Logout</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
<!-- header close -->
<!--Log out-->
<div id="logoutPopup" class="overlay">
    <div class="popup">
        <h2>Are you leaving?</h2>
        <p>Are you sure you want to logout? All your unsaved data will be lost.</p>
        <div class="button-container">
            <button class="btn-yes" id="confirmLogoutBtn">Yes</button>
            <button class="btn-cancel" id="cancelLogoutBtn">Cancel</button>
        </div>
    </div>
</div>

<form id="logoutForm" th:action="@{/logout}" method="post"></form>
<!--End log out-->

<!-- Add this script tag at the end of the header -->
<script>
    // Initialize header functionality when DOM is loaded
    document.addEventListener('DOMContentLoaded', function() {
        // User dropdown toggle
        const userDropdown = document.getElementById('userDropdown');
        if (userDropdown) {
            userDropdown.addEventListener('click', function(e) {
                e.stopPropagation();
                document.getElementById('featuresDropdown').classList.toggle('show');
            });
        }

        // Logout button
        const logoutButton = document.getElementById('logoutButton');
        if (logoutButton) {
            logoutButton.addEventListener('click', function(e) {
                e.preventDefault();
                document.getElementById('logoutPopup').classList.add('active');
            });
        }

        // Cancel logout
        const cancelLogoutBtn = document.getElementById('cancelLogoutBtn');
        if (cancelLogoutBtn) {
            cancelLogoutBtn.addEventListener('click', function() {
                document.getElementById('logoutPopup').classList.remove('active');
            });
        }

        // Confirm logout
        const confirmLogoutBtn = document.getElementById('confirmLogoutBtn');
        if (confirmLogoutBtn) {
            confirmLogoutBtn.addEventListener('click', function() {
                document.getElementById('logoutForm').submit();
            });
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.matches('.dropdown-toggle') && !e.target.closest('.dropdown-menu')) {
                const dropdowns = document.getElementsByClassName('dropdown-menu');
                for (let i = 0; i < dropdowns.length; i++) {
                    if (dropdowns[i].classList.contains('show')) {
                        dropdowns[i].classList.remove('show');
                    }
                }
            }
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/user_side/js/plugins.js"></script>
<script src="/user_side/js/designesia.js"></script>
</body>
</html>
