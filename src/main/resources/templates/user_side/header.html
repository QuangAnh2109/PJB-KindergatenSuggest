<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <link th:href="@{/user_side/css/style.css}" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Add FontAwesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/user_side/css/plugins.css}" rel="stylesheet" type="text/css">
    <link th:href="@{/user_side/css/coloring.css}" rel="stylesheet" type="text/css">

    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .overlay {
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            z-index: 9999;
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
        }

        .overlay.active {
            opacity: 1 !important;
            visibility: visible !important;
        }

        .popup {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            width: 300px;
        }

        .button-container {
            margin-top: 15px;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            cursor: pointer;
        }

        .btn-yes {
            background-color: #d9534f;
            color: white;
        }

        .btn-cancel {
            background-color: #5bc0de;
            color: white;
        }

        /* Improved Dropdown Styles */
        .logout-container {
            position: relative;
            display: inline-block;
            z-index: 1000;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-toggle {
            background-color: #1ECB15;
            color: white;
            padding: 8px 16px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .arrow-down {
            display: inline-block;
            margin-left: 8px;
            border: solid #212529;
            border-width: 0 2px 2px 0;
            padding: 3px;
            transform: rotate(45deg);
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            background-color: #fff;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1001;
            border-radius: 4px;
            margin-top: 2px;
        }

        .dropdown-menu a {
            color: #212529;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-menu a:hover {
            background-color: #f8f9fa;
        }

        .dropdown-divider {
            height: 1px;
            background-color: #e9ecef;
            margin: 0;
        }

        .show {
            display: block !important;
        }
    </style>
</head>
<body>
<!-- header begin -->
<header class="transparent scroll-light has-topbar">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="de-flex sm-pt10">
                    <div class="de-flex-col">
                        <div class="de-flex-col">
                            <!-- logo begin -->
                            <div id="logo">
                                <a th:href="@{/public/home}">
                                    <img class="logo-1" src="/user_side/images/logo-light.png" alt="">
                                    <img class="logo-2" src="/user_side/images/logo1.png" alt="">
                                </a>
                            </div>
                            <!-- logo close -->
                        </div>
                    </div>
                    <div class="de-flex-col header-col-mid">
                        <ul id="mainmenu">
                            <li><a class="menu-item" th:href="@{/public/search}">School Search</a>
                            </li>
                            <li><a class="menu-item" href="#">Community</a>
                            </li>
                            <li><a class="menu-item" href="#">About Us</a>
                            </li>
                        </ul>
                    </div>
                    <div class="de-flex-col">
                        <div class="menu_side_area" sec:authorize="!isAuthenticated()">
                            <a th:href="@{/showMyLoginPage}" class="btn-main">Login</a>
                            <span class="menu-btn"></span>
                        </div>
                        <div class="menu_side_area" sec:authorize="!isAuthenticated()">
                            <a th:href="@{/register}" class="btn-main">Sign Up</a>
                            <span class="menu-btn"></span>
                        </div>
                        <div class="logout-container" sec:authorize="isAuthenticated()">
                            <div class="dropdown">
                                <button type="button" class="dropdown-toggle" onclick="toggleDropdown(event)">
                                    <span><i class="fa fa-user" aria-hidden="true" style="margin-right: 5px"></i></span>
                                    Welcome, <span th:text="${session.nameAccount}"></span>
                                    <i class="arrow-down"></i>
                                </button>
                                <div class="dropdown-menu" id="featuresDropdown">
                                    <a href="/parent/my-school"><i class="fa-solid fa-school"></i> My School</a>
                                    <div class="dropdown-divider"></div>
                                    <a href="/pa"><i class="fas fa-clipboard-list"></i> My Request</a>
                                    <div class="dropdown-divider"></div>
                                    <a href="/feature3"><i class="fa-solid fa-user"></i> My Profile</a>
                                    <div class="dropdown-divider"></div>
                                    <a href="#" onclick="showPopup()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
<!--Log out-->
<div id="logoutPopup" class="overlay">
    <div class="popup">
        <h2>Are you leaving?</h2>
        <p>Are you sure you want to logout? All your unsaved data will be lost.</p>
        <div class="button-container">
            <button class="btn-yes" onclick="confirmLogout()">Yes</button>
            <button class="btn-cancel" onclick="hidePopup()">Cancel</button>
        </div>
    </div>
</div>

<form id="logoutForm" th:action="@{/logout}" method="post"></form>
<!--End log out-->
<script>
    function showPopup() {
        document.querySelector(".overlay").classList.add("active");
    }

    function hidePopup() {
        document.querySelector(".overlay").classList.remove("active");
    }

    function confirmLogout() {
        document.getElementById("logoutForm").submit();
    }

    function toggleDropdown(event) {
        event.stopPropagation(); // Prevent event bubbling
        document.getElementById("featuresDropdown").classList.toggle("show");
    }

    window.addEventListener('click', function(event) {
        if (!event.target.matches('.dropdown-toggle') && !event.target.closest('.dropdown-menu')) {
            var dropdowns = document.getElementsByClassName("dropdown-menu");
            for (var i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                if (openDropdown.classList.contains('show')) {
                    openDropdown.classList.remove('show');
                }
            }
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/user_side/js/plugins.js"></script>
<script src="/user_side/js/designesia.js"></script>
</body>
</html>
