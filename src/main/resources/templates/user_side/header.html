<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- Define the fragment that will be inserted -->
<header th:fragment="header" class="transparent scroll-light has-topbar">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="de-flex sm-pt10">
                    <div class="de-flex-col">
                        <div class="de-flex-col">
                            <!-- logo begin -->
                            <div id="logo">
                                <a th:href="@{/public/home}">
                                    <img class="logo-1" src="/user_side/images/logo-light.png" alt="">
                                    <img class="logo-2" src="/user_side/images/logo1.png" alt="">
                                </a>
                            </div>
                            <!-- logo close -->
                        </div>
                    </div>
                    <div class="de-flex-col header-col-mid">
                        <ul id="mainmenu">
                            <li><a class="menu-item" href="/public/school/search">School Search</a>
                            </li>
                            <li><a class="menu-item" href="#">Community</a>
                            </li>
                            <li><a class="menu-item" href="#">About Us</a>
                            </li>
                        </ul>
                    </div>
                    <div class="de-flex-col">
                        <div class="menu_side_area" sec:authorize="!isAuthenticated()">
                            <a th:href="@{/public/sign-in}" class="btn-main">Login</a>
                            <span class="menu-btn"></span>
                        </div>
                        <div class="menu_side_area" sec:authorize="!isAuthenticated()">
                            <a th:href="@{/public/register}" class="btn-main">Sign Up</a>
                            <span class="menu-btn"></span>
                        </div>
                        <div class="logout-container" sec:authorize="isAuthenticated()">
                            <div class="dropdown">
                                <button type="button" class="dropdown-toggle" onclick="toggleDropdown(event)">
                                    <span><i class="fa fa-user-o" aria-hidden="true" style="margin-right: 5px"></i></span>
                                    Welcome, <span th:text="${session.nameAccount}"></span>
                                    <i class="arrow-down"></i>
                                </button>
                                <div class="dropdown-menu dropdown-menu-right">
                                    <a href="/parent/my-school"><span><i class="fa-solid fa-school"></i></span> My
                                        School</a>
                                    <div class="dropdown-divider"></div>
                                    <a href="/parent/my-request"><span><i class="fas fa-clipboard-list"></i></span>
                                        My
                                        Request</a>
                                    <div class="dropdown-divider"></div>
                                    <a href="/auth/view-account"><span><i class="fa-solid fa-user"></i></span> My
                                        Profile</a>
                                    <div class="dropdown-divider"></div>
                                    <a href="#" onclick="showLogoutPopup(event)"><span><i
                                            class="fa-solid fa-right-from-bracket"></i></span> Logout</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!--Log out-->
    <div id="logoutPopup" class="overlay">
        <div class="popup">
            <h2>Are you leaving?</h2>
            <p>Are you sure you want to logout? All your unsaved data will be lost.</p>
            <div class="button-container">
                <button class="btn-yes" onclick="confirmLogout()">Yes</button>
                <button class="btn-cancel" onclick="cancelLogout()">Cancel</button>
            </div>
        </div>
    </div>

    <form id="logoutForm" th:action="@{/logout}" method="post"></form>
    <!--End log out-->

    <!-- Add styles for the header -->
    <style>
        .overlay {
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            z-index: 9999;
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
        }

        .overlay.active {
            opacity: 1 !important;
            visibility: visible !important;
        }

        .popup {
            align-content: center;
            justify-content: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            line-height: 2;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            width: 370px;
            height: 270px;
        }

        .button-container {
            margin-top: 15px;
        }

        .btn-yes {
            background-color: #d9534f;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            width: 100px;
        }

        .btn-cancel {
            width: 100px;
            background-color: #5bc0de;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        /* Improved Dropdown Styles */
        .logout-container {
            position: relative;
            display: inline-block;
            z-index: 1000;

        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-toggle {
            background-color: #1ECB15;
            color: white;
            padding: 8px 16px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .arrow-down {
            display: inline-block;
            margin-left: 8px;
            border: solid #212529;
            border-width: 0 2px 2px 0;
            padding: 3px;
            transform: rotate(45deg);
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            background-color: #fff;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1001;
            border-radius: 4px;
            margin-top: 2px;
        }

        .dropdown-menu a {
            color: #212529;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-menu a:hover {
            background-color: #f8f9fa;
        }

        .dropdown-divider {
            height: 1px;
            background-color: #e9ecef;
            margin: 0;
        }

        .show {
            display: block !important;
        }
    </style>

    <!-- Add inline scripts with global functions -->
    <script th:inline="javascript">
        // Use immediate functions to avoid polluting global namespace
        (function() {
            // Add click handler to close dropdowns when clicking outside
            document.addEventListener('click', function(e) {
                var dropdowns = document.querySelectorAll('.dropdown-menu');
                dropdowns.forEach(function(dropdown) {
                    if (dropdown.classList.contains('show')) {
                        dropdown.classList.remove('show');
                    }
                });
            });
        })();

        // Global functions that need to be accessed by inline event handlers
        function toggleDropdown(event) {
            event.preventDefault();
            event.stopPropagation();

            // Find the dropdown menu that is a sibling of the clicked button
            var dropdownMenu = event.currentTarget.nextElementSibling;

            // Close all other open dropdowns first
            var allDropdowns = document.querySelectorAll('.dropdown-menu');
            allDropdowns.forEach(function(dropdown) {
                if (dropdown !== dropdownMenu && dropdown.classList.contains('show')) {
                    dropdown.classList.remove('show');
                }
            });

            // Toggle current dropdown
            dropdownMenu.classList.toggle('show');
        }

        function showLogoutPopup(event) {
            event.preventDefault();
            document.getElementById('logoutPopup').classList.add('active');
        }

        function cancelLogout() {
            document.getElementById('logoutPopup').classList.remove('active');
        }

        function confirmLogout() {
            document.getElementById('logoutForm').submit();
        }
    </script>
    <script src="/user_side/js/dropdown.js"></script>
</header>

</html>
