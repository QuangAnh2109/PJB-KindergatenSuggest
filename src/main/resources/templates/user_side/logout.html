<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<button type="button" onclick="showPopup()">Logout</button>

<div id="logoutPopup" class="overlay">
  <div class="popup">
    <h2>Are you sure you want to logout?</h2>
    <div class="button-container">
      <button class="btn btn-yes" onclick="confirmLogout()">Yes</button>
      <button class="btn btn-cancel" onclick="hidePopup()">Cancel</button>
    </div>
  </div>
</div>

<form id="logoutForm" action="#" th:action="@{/logout}" method="post"></form>

<script>
  function showPopup() {
    document.getElementById("logoutPopup").style.display = "block";
  }
  function hidePopup() {
    document.getElementById("logoutPopup").style.display = "none";
  }
  function confirmLogout() {
    document.getElementById("logoutForm").submit();
  }
</script>

</body>
</html>
