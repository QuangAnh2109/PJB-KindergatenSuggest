<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zxx">
<head>
    <title>Register</title>
    <link rel="icon" th:href="@{/user_side/images/icon.png}" type="image/gif" sizes="16x16">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rentaly - Multipurpose Vehicle Car Rental Website Template">
    <link th:href="@{/user_side/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/mdb.min.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/plugins.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/style.css}" rel="stylesheet">
    <link th:href="@{/user_side/css/coloring.css}" rel="stylesheet">
    <link id="colors" th:href="@{/user_side/css/colors/scheme-01.css}" rel="stylesheet">
</head>
<body>
<div id="wrapper">
    <div id="de-preloader"></div>
    <div th:replace="user_side/header :: header"></div>

    <section id="subheader" class="jarallax text-light text-center">
        <img th:src="@{/user_side/images/background/subheader.jpg}" class="jarallax-img" alt="">
        <div class="center-y relative">
            <h1>Register</h1>
        </div>
    </section>

    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <h3 class="text-center mb-4">Create a new account</h3>
                    <form th:action="@{/public/register}" th:object="${accountVo}" method="post"
                          class="p-4 shadow rounded bg-white">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" th:field="*{fullName}" class="form-control"
                                   placeholder="Enter your full name">
                            <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"
                                  class="text-danger"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="info@xyz.com">
                            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></span>
                            <span th:if="${emailError}" th:text="${emailError}" class="text-danger"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mobile No.</label>
                            <input type="text" th:field="*{phone}" class="form-control" placeholder="099999999">
                            <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-danger"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" th:field="*{password}" class="form-control"
                                   placeholder="xxxxxxxxxxxx">
                            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"
                                  class="text-danger"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" th:field="*{confirmPassword}" class="form-control"
                                   placeholder="xxxxxxxxxxxx">
                            <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"
                                  class="text-danger"></span>
                            <span th:if="${confirmPasswordError}" th:text="${confirmPasswordError}"
                                  class="text-danger"></span>
                        </div>
                        <div>
                            <p th:if="${message}" th:text="${message}" style="color: green;"></p>
                        </div>
                        <div class="d-flex justify-content-between">
                            <input type="reset" value="Cancel" class="btn-primary btn w-45">
                            <input type="submit" value="Sign Up" class="btn btn-primary w-45">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</div>

<script th:src="@{/user_side/js/plugins.js}"></script>
<script th:src="@{/user_side/js/designesia.js}"></script>
</body>
</html>
